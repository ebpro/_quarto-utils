listing:
  # Content organization
  contents:
    - "**/*.qmd"
    - "!index.qmd"
    - "!_*.qmd"
  sort:
    - "filename"
    - "date desc"
    - "title asc"
  
  # Visual presentation
  type: grid
  grid-columns: 3
  grid-item-border: true
  image-height: 250px
  page-size: 9
  
  # Metadata display
  fields:
    - "title"
    - "subtitle"
    - "description"
    - "date"
#    - "image"
    - "categories"
#    - "reading-time"
  
  # Navigation and filtering
  categories: true
  sort-ui: true
  filter-ui: true
  date-format: "DD MMMM YYYY"
  
  # Custom template
  template: ./_quarto-utils/gallery.ejs
  
