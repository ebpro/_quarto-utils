listing:
  # Content organization
  contents:
    - "*.qmd"
    - "!index.qmd"
    - "!_*.qmd"
  sort:
    - "date desc"
    - "title asc"
    - "filename"

  # Visual presentation
  type: grid
  grid-columns: 3
  grid-item-border: true
  image-height: 250px

  # Metadata display
  fields:
    - "title"
    - "subtitle"
    - "description"
    - "date"
    - "image"
    - "categories"
    - "programs"
    - "reading-time"

  # Navigation and filtering
  categories: true
  sort-ui: [date, title, filename]
  filter-ui: true
  date-format: "DD MMMM YYYY"

  # Custom template
  template: ./_quarto-utils/gallery.ejs

  # Page size: show more items per page for index
  page-size: 12

