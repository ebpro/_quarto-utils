project:
  type: website
  output-dir: _output/

  render:
    - "**/*.qmd"  # rend tous les fichiers .qmd par défaut (récursif)
    - "!**/HIDDEN/**"  # ignore tout contenu sous un répertoire HIDDEN (à n'importe quelle profondeur)
    - "!_quarto-utils/**"
    - "!notebook-containers-intro/**"
website:
  title: "Emmanuel BRUNO"
  open-graph: true
  page-navigation: true
  bread-crumbs: true

  sidebar:
    style: docked
    contents: auto

  headincludes:
    - text: |
        <script src="_quarto-utils/gallery-search.js" defer></script>

format:  
  typst:
    toc: true
    section-numbering: 1.1.a
    columns: 2
    titlepage: true
    figure-numbering: true
    table-numbering: true
    citation-style: apa
    font-family: "Linux Libertine"
    font-size: 12pt
    color: "#333366"
    header: "Titre du document"
    footer: "Page {page}"

  html:
    theme: 
      light: [flatly, _quarto-utils/custom.scss]
      dark:  [darkly,  _quarto-utils/custom.scss]  
      #light: [flatly]
      #dark:  [darkly]  

    toc: true

format-links:
  - html
  - format: typst
    text: PDF
    icon: file-pdf