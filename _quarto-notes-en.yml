project:
  type: website
  output-dir: _output/

  render:
    - "**/*.qmd"  # rend tous les fichiers .qmd par défaut (récursif)
    - "!**/HIDDEN/**"  # ignore tout contenu sous un répertoire HIDDEN (à n'importe quelle profondeur)
    - "!_quarto-utils/**"
    - "!notebook-containers-intro/**"
website:
  title: "Emmanuel BRUNO"
  open-graph: true
  page-navigation: true
  bread-crumbs: true

  sidebar:
    style: docked
    contents: auto

format:
  typst:
    toc: true
    section-numbering: 1.1.a
    columns: 2
    titlepage: true
    figure-numbering: true
    table-numbering: true
    citation-style: apa
    font-family: "Linux Libertine"
    font-size: 12pt
    color: "#333366"
    header: "Document Title"
    footer: "Page {page}"

  html:
    theme: 
      light: [flatly, _quarto-utils/custom.scss]
      dark:  [darkly,  _quarto-utils/custom.scss]  
      #light: [flatly]
      #dark:  [darkly]  

    toc: true
    # CENTRALISÉ ICI : css est sémantique « replace-not-merge » (le front matter
    # d'une page REMPLACE la liste du projet, il ne la fusionne pas). Cette liste
    # à UNE SEULE entrée n'est sûre que tant que le front matter des dépôts qui
    # gardent une entrée css (notebook-git, notebook-containers-intro,
    # DEV-ADV, CNAM PO43/PM44, notebook-java-jpa, notebook-quarto-sample) est
    # EXACTEMENT identique (même entrée unique `_quarto-utils/gallery-custom.css`).
    # Ne pas ajouter d'entrée ici sans aligner ces front matters, et ne pas
    # retirer le préfixe `_quarto-utils/` (chemins résolus depuis la racine du
    # projet consommateur, cf. theme: [_quarto-utils/custom.scss] plus haut).
    css:
      - _quarto-utils/gallery-custom.css
    # Depth-safe (PR fix/gallery-search-nested-path) : un <script src> relatif
    # dans include-in-header est émis VERBATIM dans le <head> (contrairement à
    # css:, ressource suivie dont Quarto réajuste le href selon la profondeur de
    # la page) → il 404 sur les pages imbriquées d'une lecture (<elo>/…). Le corps
    # du script est donc inliné ici, identique octet pour octet à
    # _quarto-utils/gallery-search.js (source canonique ; garder les copies
    # synchronisées). La garde interne du script le rend inerté hors galerie,
    # et defer était inutile (auto-différé via DOMContentLoaded).
    include-in-header:
      - text: |
          <script>
          /* Canonical source for the inlined copies in _quarto-notes.yml and
             _quarto-notes-en.yml (include-in-header). The inlined bodies are
             byte-identical to this file; keep the copies in sync. Inlining is
             required because a relative <script src> in include-in-header is emitted
             verbatim and 404s on nested lecture pages (fix/gallery-search-nested-path). */
          /* Gallery search - client-side filter for course index cards */
          (function() {
            'use strict';

            function init() {
              var input = document.querySelector('.gallery-search');
              var cards = document.querySelectorAll('.g-card');
              var count = document.getElementById('gallery-count');

              if (!input || cards.length === 0) { return; }

              if (count) {
                count.textContent = cards.length + (cards.length > 1 ? ' items' : ' item');
              }

              input.addEventListener('input', function() {
                var q = this.value.toLowerCase().trim();
                var visible = 0;
                for (var i = 0; i < cards.length; i++) {
                  var card = cards[i];
                  var title = card.getAttribute('data-title') || '';
                  var desc = card.getAttribute('data-desc') || '';
                  var match = (!q || title.indexOf(q) !== -1 || desc.indexOf(q) !== -1);
                  card.style.display = match ? '' : 'none';
                  if (match) { visible++; }
                }
                if (count) {
                  count.textContent = visible + (visible > 1 ? ' items' : ' item');
                }
              });
            }

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', init);
            } else {
              init();
            }
          })();
          </script>

format-links:
  - html
  - format: typst
    text: PDF
    icon: file-pdf