project:
  render:
    - "*_L_*.qmd" # rend tous les fichiers de type Lecture
    - "*_L_*.ipynb" # rend tous les fichiers de type Lecture
    - "!**/STAGING/**" # ignore tous les dossiers nommés STAGING
  post-render: _quarto-utils/move-slides.sh

format:
  clean-revealjs:

    # Presentation settings
    theme: [white]
    css:
      - _quarto-utils/reveal-custom.css
    highlight-style: github
    footer: "E. Bruno - {{< meta title >}}"
    slide-level: 3
    navigation-mode: vertical
    slide-number: c/t

    # Code display
    code-overflow: wrap
    code-block-bg: true
    code-copy: true
    code-line-numbers: true

    # Features
    multiplex: false
    transition: slide
    progress: true
    scrollable: true
    preview-links: true

    # Controls
    controls: true
    controls-layout: bottom-right

    # Plugins
    chalkboard:
      enabled: true
      buttons: true

    # PDF Export
    pdf-separate-fragments: true

    # Performance
    # embed-resources: true
    smaller: true

    includes:
      after-body:
        - _quarto-utils/mermaid-reveal-fix.html

revealjs-plugins:
  - verticator
