project:
  output-dir: _output/_slides
  render:
    - "**/*_L_*.qmd" # rend tous les fichiers de type Lecture (récursif)
    - "**/*_L_*.ipynb" # rend tous les fichiers de type Lecture (récursif)
    - "!**/HIDDEN/**" # ignore tout contenu sous un répertoire HIDDEN (à n'importe quelle profondeur)
    - "!_quarto-utils/**"
    - "!notebook-containers-intro/**"

format:
  clean-revealjs:

    # Presentation settings
    # theme: [clean, _quarto-utils/custom.scss]

    theme: [_quarto-utils/custom.scss]
    # Chemin résolu depuis la racine du projet consommateur (même convention que
    # `theme:` ci-dessus). « replace-not-merge » : un front matter qui redéfinit
    # `css:` remplace cette liste — le préfixer avec `_quarto-utils/reveal-custom.css`.
    css:
      - _quarto-utils/reveal-custom.css
    highlight-style: github
    footer: "E. Bruno - {{< meta title >}}"
    slide-level: 3
    navigation-mode: vertical
    slide-number: c/t

    # Code display
    code-overflow: wrap
    code-block-bg: true
    code-copy: true
    code-line-numbers: true

    # Features
    multiplex: false
    transition: slide
    progress: true
    scrollable: true
    preview-links: true

    # Controls
    controls: true
    controls-layout: bottom-right

    # Plugins
    chalkboard: 
      enabled: true
      buttons: true
    
    # PDF Export
    pdf-separate-fragments: true
    
    # Performance
    # embed-resources: true
    smaller: true

revealjs-plugins:
  - verticator
