version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/_quarto-utils"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    # Leave reviewers empty by default; teams/repos can add reviewers via CODEOWNERS
    # Dependabot will update package.json and package-lock.json together.
