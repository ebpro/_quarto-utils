name: Render and deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

jobs:
  render:
    uses: ebpro/_quarto-utils/.github/workflows/render-quarto.yml@main
    with:
      profiles: 'notes,slides'
      quarto-image: 'quarto/quarto:latest'
      utils-repo: 'ebpro/_quarto-utils'
      utils-ref: 'main'
      output-path: '_output'

  deploy-pages:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - name: Download rendered zip artifact
        uses: actions/download-artifact@v4
        with:
          name: site-zip
          path: site

      - name: Unzip artifact
        run: |
          mkdir -p site_unpacked
          # find the downloaded zip file and unzip it
          unzip -o "$(ls site/*.zip | head -n1)" -d site_unpacked || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./site_unpacked/_output
          publish_branch: gh-pages
          commit_message: "chore: deploy site from ${{ github.ref }} (${{ github.sha }})"
          github_token: ${{ secrets.GITHUB_TOKEN }}
