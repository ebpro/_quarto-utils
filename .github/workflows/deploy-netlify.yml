name: Render and deploy to Netlify (develop & feature branches)

on:
  push:
    branches:
      - develop
      - 'feature/*'

jobs:
  render:
    uses: ebpro/_quarto-utils/.github/workflows/render-quarto.yml@main
    with:
      profiles: 'notes,slides'
      quarto-image: 'quarto/quarto:latest'
      utils-repo: 'ebpro/_quarto-utils'
      utils-ref: 'main'
      output-path: '_output'

  deploy-netlify:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - name: Download rendered zip artifact
        uses: actions/download-artifact@v4
        with:
          name: site-zip
          path: site

      - name: Unzip artifact
        run: |
          mkdir -p site_unpacked
          # find the downloaded zip file and unzip it
          unzip -o "$(ls site/*.zip | head -n1)" -d site_unpacked || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify (draft)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_SITE_ID_SLIDES: ${{ secrets.NETLIFY_SITE_ID_SLIDES }}
          NETLIFY_SITE_ID_NOTES: ${{ secrets.NETLIFY_SITE_ID_NOTES }}
        run: |
          echo "Deploy step: NETLIFY_SITE_ID=$NETLIFY_SITE_ID, SLIDES=$NETLIFY_SITE_ID_SLIDES, NOTES=$NETLIFY_SITE_ID_NOTES"
          set -euo pipefail
          # Deploy slides if slides site id provided and slides output exists
          SLIDES_DIR=site_unpacked/_output/_slides
          if [ -n "${NETLIFY_SITE_ID_SLIDES:-}" ] && [ -d "${SLIDES_DIR}" ]; then
            echo "Deploying slides to Netlify site: ${NETLIFY_SITE_ID_SLIDES}"
            npx netlify deploy --dir=${SLIDES_DIR} --site=${NETLIFY_SITE_ID_SLIDES} --auth=${NETLIFY_AUTH_TOKEN} --message "CI slides deploy ${GITHUB_REF_NAME:-${GITHUB_REF}} ${GITHUB_SHA}"
          else
            echo "Skipping slides deploy (no slides site id or slides dir missing)"
          fi

          # Deploy notes if notes site id provided
          NOTES_DIR=site_unpacked/_output
          if [ -n "${NETLIFY_SITE_ID_NOTES:-}" ]; then
            echo "Deploying notes (full site) to Netlify site: ${NETLIFY_SITE_ID_NOTES}"
            npx netlify deploy --dir=${NOTES_DIR} --site=${NETLIFY_SITE_ID_NOTES} --auth=${NETLIFY_AUTH_TOKEN} --message "CI notes deploy ${GITHUB_REF_NAME:-${GITHUB_REF}} ${GITHUB_SHA}"
          else
            echo "Skipping notes deploy (no notes site id)"
          fi
