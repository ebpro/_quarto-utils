                      # contexte NON déployé — le job deploy-static n'exécute déjà que sur
                      # push/delete (if: github.event_name == 'push' || 'delete'). Le `*)`
                      # hérité de la règle v1.3.22 faisait exit 1 sur ces refs, donc ROUGE
                      # systématique (fake red) sur toute l'auto-CI de _quarto-utils et sur
                      # tout wrapper appelant en pull_request (cas documenté: PR #27,
                      # 'refs/pull/27/merge' -> ::error + exit 1 dans le step render).
                      # Même traitement que tag non-v : avis + rendu SANS override baseurl
                      # (SUBPATH vide -> branche « rendu sans override » ci-dessous).
                      echo "::warning::deploy-static=true mais GITHUB_REF '$GITHUB_REF' est un événement pull_request (contexte non déployé) — rendu sans override baseurl"
                      ;;
                  esac
                  ;;
                *)
                  echo "::error::deploy-static=true mais GITHUB_REF '$GITHUB_REF' n'est ni une branche ni un tag; rendu avec baseurl refusé"
                  exit 1
                  ;;
              esac
            fi
            if [ -z "$SUBPATH" ]; then
              # Assouplissement v1.3.22 (décision lead) : refs/tags/<non-v*> ->
              # pas de déploiement -> rendu SANS override baseurl, avec la notice
              # ci-dessus. Le job render N'ÉCHECHE PLUS pour un tag non-v*.
              echo "ℹ️  deploy-static: réf '$GITHUB_REF' non déployée -> rendu sans override baseurl"
            else
              BASEURL="${BASEPATH}/${REPO}/${SUBPATH}/"
              echo "ℹ️  deploy-static: BASEURL=$BASEURL"
              BASEURL_ARG=" --metadata baseurl=$BASEURL"
            fi
          fi
          # --- SEO: directives d'indexation par famille (input seo-directives) ----
          # Même règle ref_family() que le bloc baseurl (source unique, cf. above) :
          #   famille develop   -> website.site-url -> canonical + sitemap.xml Quarto
          #   famille previews  -> <meta name="robots" content="noindex, follow">
          #   releases/tags, pull_request, autres refs -> AUCUNE injection (les
          #   releases gardent la stratégie canonical actuelle, question ouverte
          #   d'indexation v-tag dans la flotte; PR: jamais publié -> rien à marquer).
          # Mécanisme: _quarto.yml.local ("Local Config", couche documentée de
          # Quarto, fusion profonde sur _quarto.yml + profil actif; les listes
          # include-in-header s'APPENDENT, fusion non-remplacement — vérifié sur
          # l'image de rendu de la flotte, Quarto 1.10.18, 2026-10-19). Le flag CLI
          # `--config` n'existe PAS pour `quarto render` de projet en 1.10.18 (il
          # fuit vers pandoc: "Unknown option --config", rendu rouge — même date).
          # Fichier NON TRACKÉ, régénéré par profil dans la boucle ci-dessous et
          # supprimé inconditionnellement ici (workspace self-hosted persistant ->
          # pas de fuite de directives develop -> previews entre runs).
          rm -f "$GITHUB_WORKSPACE/_quarto.yml.local"
