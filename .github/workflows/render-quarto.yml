name: Render Quarto Documents (reusable)

on:
  workflow_call:
    inputs:
      profiles:
        description: 'Comma-separated list of profiles to render (e.g. notes,slides)'
        required: false
        type: string
        default: 'notes,slides'
      quarto-image:
        description: 'Docker image to use for Quarto (must include `quarto` CLI)'
        required: false
        type: string
        default: 'harbor.ebruno.fr/ghcr-p2c/ebpro/solen:quarto-full-chore-add-pyproject'
      utils-repo:
        description: 'Repository that provides shared Quarto utils (owner/repo)'
        required: false
        type: string
        default: 'ebpro/_quarto-utils'
      utils-ref:
        description: 'Ref (branch or tag) of the utils repo to checkout'
        required: false
        type: string
        default: 'main'
      output-path:
        description: 'Path to output artifacts (glob-friendly)'
        required: false
        type: string
        default: '_output'
      deploy:
        description: 'Deploy rendered site to GitHub Pages (push events only)'
        required: false
        type: boolean
        default: true
      nested-dind:
        description: 'Render in an isolated nested DinD daemon instead of mounting the caller Docker socket'
        required: false
        type: boolean
        default: false
      harbor-registry:
        description: 'Optional Harbor registry host override (e.g. harbor.ebruno.fr). Resolution order: this input -> vars.HARBOR_REGISTRY -> runner env HARBOR_REGISTRY -> the harbor.ebruno.fr host if the quarto image is already on Harbor. Used only to route Docker Hub images through the Harbor proxy cache; empty = auto-detect.'
        required: false
        type: string
        default: ''
      dockerhub-proxy-project:
        description: 'Optional Harbor Docker Hub proxy project override (e.g. proxy-docker-hub). Resolution order: this input -> vars.HARBOR_DOCKERHUB_PROXY -> runner env HARBOR_DOCKERHUB_PROXY. No default: the proxy cache is used only when a project resolves, so runners without Harbor configuration keep pulling images directly.'
        required: false
        type: string
        default: ''
      runner-pool:
        description: 'Self-hosted runner pool label for the render job. "ebpro-org" (default) = standard pool; "large" = high-memory pool for memory-heavy renders (e.g. notebook-containers-intro). Any other value falls back to the standard pool.'
        required: false
        type: string
        default: 'ebpro-org'

jobs:
  render:
    runs-on: ${{ inputs.runner-pool == 'large' && fromJSON('["self-hosted","linux","x64","large"]') || fromJSON('["self-hosted","linux","ebpro-org","x64"]') }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository (caller) with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.EBPRO_CI_PAT || secrets.GITHUB_TOKEN }}

      - name: Clear submodule-populated utils (re-checkout at desired ref)
        run: rm -rf _quarto-utils

      - name: Checkout utilities repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.utils-repo }}
          ref: ${{ inputs.utils-ref }}
          path: _quarto-utils
          token: ${{ secrets.EBPRO_CI_PAT || secrets.GITHUB_TOKEN }}

      - name: Create compatibility symlink
        run: ln -s _quarto-utils quarto-utils

      - name: Detect Docker socket
        id: docker_detect
        run: |
          if [ -S /var/run/docker.sock ]; then
            echo "socket=true" >> "$GITHUB_OUTPUT"
          else
            echo "socket=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve proxy/cache configuration
        id: proxy
        env:
          INPUT_HARBOR_REGISTRY: ${{ inputs.harbor-registry }}
          VAR_HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
          INPUT_PROXY_PROJECT: ${{ inputs.dockerhub-proxy-project }}
          VAR_PROXY_PROJECT: ${{ vars.HARBOR_DOCKERHUB_PROXY }}
          QUARTO_IMAGE: ${{ inputs.quarto-image }}
        run: |
          set -euo pipefail

          # --- Effective Harbor registry host ---
          # Resolution order: input -> org var -> runner env -> derive from the
          # quarto image when it is already hosted on Harbor. Normalized by
          # stripping any scheme and the trailing slash.
          REGISTRY="${INPUT_HARBOR_REGISTRY:-${VAR_HARBOR_REGISTRY:-${HARBOR_REGISTRY:-}}}"
          if [ -z "$REGISTRY" ]; then
            case "$QUARTO_IMAGE" in
              harbor.ebruno.fr/*) REGISTRY="harbor.ebruno.fr" ;;
            esac
          fi
          REGISTRY="${REGISTRY#http://}"
          REGISTRY="${REGISTRY#https://}"
          REGISTRY="${REGISTRY%/}"

          # --- Effective Docker Hub proxy project ---
          # Resolution order: input -> org var -> runner env. No default: the proxy
          # cache is opt-in so runners without Harbor config keep their direct pulls.
          PROXY_PROJECT="${INPUT_PROXY_PROJECT:-${VAR_PROXY_PROJECT:-${HARBOR_DOCKERHUB_PROXY:-}}}"

          # --- Validate the proxy project name (sibling convention) ---
          # Harbor project names must match ^[a-z0-9][a-z0-9._-]*$. A malformed value
          # (e.g. stray uppercase/whitespace from an org var) must never break the
          # render: we fall back to direct pulls and warn instead of aborting.
          PROXY_PROJECT_VALID=true
          if [ -n "$PROXY_PROJECT" ] && ! [[ "$PROXY_PROJECT" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            PROXY_PROJECT_VALID=false
          fi

          # --- Is the proxy cache active? ---
          # Requires BOTH a resolvable registry host AND a well-formed proxy project so
          # that every rewritten image reference is valid. A malformed project name
          # disables the cache (direct pulls) rather than failing the render.
          if [ -n "$REGISTRY" ] && [ -n "$PROXY_PROJECT" ] && [ "$PROXY_PROJECT_VALID" = true ]; then
            PROXY_ENABLED=true
          else
            PROXY_ENABLED=false
          fi

          # --- Rewrite the nested DinD image (always an official image) ---
          DIND_IMAGE=docker:28-dind
          if [ "$PROXY_ENABLED" = true ]; then
            DIND_IMAGE="${REGISTRY}/${PROXY_PROJECT}/library/${DIND_IMAGE}"
          fi

          # --- Rewrite the render image (Docker Hub references only) ---
          # Left unchanged: ghcr.io / quay.io / localhost / any registry-qualified
          # reference (first path segment contains a dot or colon AND there is a
          # slash). An explicit docker.io/ prefix is stripped first. Official
          # (no-slash) images gain a /library/ segment; user/repo images keep their
          # path under the proxy project.
          RENDER_IMAGE="$QUARTO_IMAGE"
          if [ "$PROXY_ENABLED" = true ]; then
            IMG="$QUARTO_IMAGE"
            case "$IMG" in
              docker.io/*) IMG="${IMG#docker.io/}" ;;
            esac
            case "$IMG" in
              */*)
                first="${IMG%%/*}"
                if [[ "$first" != *"."* && "$first" != *":"* ]]; then
                  RENDER_IMAGE="${REGISTRY}/${PROXY_PROJECT}/${IMG}"
                fi
                ;;
              *)
                RENDER_IMAGE="${REGISTRY}/${PROXY_PROJECT}/library/${IMG}"
                ;;
            esac
          fi

          # --- Runner proxy env forwarding ---
          # Detect whether any proxy is configured on the runner (URL-bearing vars).
          PROXY_PRESENT=false
          for v in HTTP_PROXY HTTPS_PROXY http_proxy https_proxy; do
            if [ -n "${!v:-}" ]; then PROXY_PRESENT=true; break; fi
          done

          # Merged NO_PROXY: internal endpoints + any existing NO_PROXY/no_proxy,
          # de-duplicated (order preserved). Only computed when a proxy is present.
          MERGED_NO_PROXY=""
          if [ "$PROXY_PRESENT" = true ]; then
            INTERNAL=(localhost 127.0.0.1 ::1 dind harbor.ebruno.fr nexus.ebruno.fr nexus-api.ebruno.fr)
            [ -n "$REGISTRY" ] && INTERNAL+=("$REGISTRY")
            declare -A _seen=()
            for src in "${INTERNAL[@]}" "${NO_PROXY:-}" "${no_proxy:-}"; do
              [ -z "$src" ] && continue
              IFS=',' read -ra _parts <<< "$src"
              for e in "${_parts[@]}"; do
                [ -z "$e" ] && continue
                if [ -z "${_seen[$e]:-}" ]; then
                  _seen[$e]=1
                  if [ -n "$MERGED_NO_PROXY" ]; then MERGED_NO_PROXY="${MERGED_NO_PROXY},${e}"; else MERGED_NO_PROXY="$e"; fi
                fi
              done
            done
          fi

          # Names (never values) of the proxy vars actually set on the runner.
          PROXY_NAMES=""
          for v in HTTP_PROXY HTTPS_PROXY NO_PROXY http_proxy https_proxy no_proxy; do
            if [ -n "${!v:-}" ]; then
              if [ -n "$PROXY_NAMES" ]; then PROXY_NAMES="${PROXY_NAMES} ${v}"; else PROXY_NAMES="$v"; fi
            fi
          done

          echo "Proxy cache: $( [ "$PROXY_ENABLED" = true ] && echo enabled || echo disabled )"
          if [ -n "$PROXY_PROJECT" ] && [ "$PROXY_PROJECT_VALID" != true ]; then
            echo "WARNING: Docker Hub proxy project '$PROXY_PROJECT' does not match ^[a-z0-9][a-z0-9._-]*$; proxy cache disabled, falling back to direct image pulls."
          fi
          if [ "$PROXY_ENABLED" = true ]; then
            echo "Harbor registry host: $REGISTRY"
            echo "Docker Hub proxy project: $PROXY_PROJECT"
          fi
          echo "DinD image: $DIND_IMAGE"
          echo "Render image: $RENDER_IMAGE"
          if [ "$PROXY_PRESENT" = true ]; then
            echo "Forwarding proxy env vars: $PROXY_NAMES"
            echo "Merged NO_PROXY: $MERGED_NO_PROXY"
          else
            echo "Forwarding proxy env vars: (none set on runner)"
          fi

          {
            echo "registry=$REGISTRY"
            echo "proxy_project=$PROXY_PROJECT"
            echo "proxy_project_valid=$PROXY_PROJECT_VALID"
            echo "proxy_enabled=$PROXY_ENABLED"
            echo "dind_image=$DIND_IMAGE"
            echo "render_image=$RENDER_IMAGE"
            echo "proxy_present=$PROXY_PRESENT"
            echo "merged_no_proxy=$MERGED_NO_PROXY"
          } >> "$GITHUB_OUTPUT"

      - name: Set up isolated DinD
        id: nested_dind
        if: steps.docker_detect.outputs.socket == 'true' && inputs.nested-dind
        env:
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          DIND_IMAGE_RESOLVED: ${{ steps.proxy.outputs.dind_image }}
          PROXY_PRESENT: ${{ steps.proxy.outputs.proxy_present }}
          MERGED_NO_PROXY: ${{ steps.proxy.outputs.merged_no_proxy }}
        run: |
          set -euo pipefail

          DIND_IMAGE="$DIND_IMAGE_RESOLVED"
          DIND_NETWORK="qk-dind-${RUN_ID}-${ATTEMPT}"
          DIND_CONTAINER="qk-dind-${RUN_ID}-${ATTEMPT}-daemon"
          CERT_DIR="${RUNNER_TEMP}/qk-dind-certs"

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "dind_network=$DIND_NETWORK" >> "$GITHUB_OUTPUT"
          echo "dind_container=$DIND_CONTAINER" >> "$GITHUB_OUTPUT"
          echo "dind_cert_dir=$CERT_DIR" >> "$GITHUB_OUTPUT"

          rm -rf "$CERT_DIR"
          mkdir -p "$CERT_DIR"

          docker network create "$DIND_NETWORK"

          # Detect the cgroup layout of the caller environment so the nested
          # daemon is given a cgroup tree it can actually use. The previous
          # strategy masked /sys/fs/cgroup with an empty tmpfs, which left the
          # nested daemon without a `devices` cgroup and failed with:
          #   failed to start daemon: Devices cgroup isn't mounted
          # Instead we bind-mount the caller's existing cgroupfs.
          if [ -f /sys/fs/cgroup/cgroup.controllers ]; then
            CGROUP_MODE=cgroup2
          elif [ -d /sys/fs/cgroup/devices ]; then
            CGROUP_MODE=cgroup1
          else
            CGROUP_FSTYPE=$(stat -fc %T /sys/fs/cgroup 2>/dev/null || echo unknown)
            case "$CGROUP_FSTYPE" in
              cgroup2|cgroup2fs) CGROUP_MODE=cgroup2 ;;
              tmpfs) CGROUP_MODE=cgroup1 ;;
              *) CGROUP_MODE=unknown ;;
            esac
          fi

          echo "Nested DinD cgroup mode: $CGROUP_MODE"
          stat -fc '%n %T' /sys/fs/cgroup || true
          grep ' /sys/fs/cgroup ' /proc/self/mountinfo || true

          DIND_RUN_ARGS=(
            -d
            --privileged
            --name "$DIND_CONTAINER"
            --network "$DIND_NETWORK"
            --network-alias dind
            -e DOCKER_TLS_CERTDIR=/certs
            -e DOCKER_TLS_SAN=DNS:dind
          )

          if [ "$CGROUP_MODE" = cgroup1 ]; then
            # Recursive read-only bind of the caller's cgroup tree so the nested
            # daemon sees the devices (and other) controllers already mounted.
            DIND_RUN_ARGS+=(
              --mount "type=bind,src=/sys/fs/cgroup,dst=/sys/fs/cgroup,readonly,bind-propagation=rslave"
            )
          elif [ "$CGROUP_MODE" = cgroup2 ]; then
            # Host cgroup namespace plus a writable bind so the daemon can create
            # its own cgroups in the unified hierarchy.
            DIND_RUN_ARGS+=(
              --cgroupns=host
              --mount "type=bind,src=/sys/fs/cgroup,dst=/sys/fs/cgroup,bind-propagation=rprivate"
            )
          else
            echo "Unsupported cgroup layout in caller container"
            exit 1
          fi

          if [ -f "${HOME}/.docker/config.json" ]; then
            DIND_RUN_ARGS+=(-v "${HOME}/.docker:/root/.docker:ro")
          fi

          # Forward runner proxy env vars into the nested daemon so its image pulls
          # use the same egress/proxy as the runner. Only vars actually set are
          # forwarded; NO_PROXY is always the merged value (internal endpoints) so
          # dind/harbor/nexus bypass the proxy. Proxy URLs are runner egress config,
          # not secrets, and are not printed here.
          if [ "${PROXY_PRESENT:-false}" = "true" ]; then
            for v in HTTP_PROXY HTTPS_PROXY http_proxy https_proxy; do
              if [ -n "${!v:-}" ]; then
                DIND_RUN_ARGS+=("-e" "$v=${!v}")
              fi
            done
            DIND_RUN_ARGS+=("-e" "NO_PROXY=${MERGED_NO_PROXY}")
            DIND_RUN_ARGS+=("-e" "no_proxy=${MERGED_NO_PROXY}")
            echo "Forwarding proxy env vars into DinD container"
          fi

          docker pull "$DIND_IMAGE"
          docker run "${DIND_RUN_ARGS[@]}" "$DIND_IMAGE"

          ready=false
          for _ in $(seq 1 60); do
            if docker exec "$DIND_CONTAINER" docker info >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "Isolated DinD failed to become ready"
            echo "CGROUP_MODE=${CGROUP_MODE}"
            stat -fc '%n %T' /sys/fs/cgroup || true
            grep ' /sys/fs/cgroup ' /proc/self/mountinfo || true
            docker logs "$DIND_CONTAINER" || true
            exit 1
          fi

          docker cp "$DIND_CONTAINER":/certs/client/. "$CERT_DIR/"
          echo "Nested DinD ready: network=$DIND_NETWORK container=$DIND_CONTAINER certs=$CERT_DIR"

      - name: Render with Quarto (Docker)
        # Fail fast: a hung render (blocked browser/tool install, stalled container,
        # or a wedged nested-DinD TLS handshake) must not silently burn the full
        # 360-minute job budget. 30 minutes covers the image pull plus a normal
        # notes+slides render with headroom, and surfaces the failure for diagnosis.
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILES: ${{ inputs.profiles }}
          QUARTO_IMAGE: ${{ steps.proxy.outputs.render_image }}
          EBPRO_CI_PAT: ${{ secrets.EBPRO_CI_PAT }}
          NESTED_DIND_ENABLED: ${{ steps.nested_dind.outputs.enabled }}
          NESTED_DIND_NETWORK: ${{ steps.nested_dind.outputs.dind_network }}
          NESTED_DIND_CERT_DIR: ${{ steps.nested_dind.outputs.dind_cert_dir }}
          PROXY_PRESENT: ${{ steps.proxy.outputs.proxy_present }}
          MERGED_NO_PROXY: ${{ steps.proxy.outputs.merged_no_proxy }}
        run: |
          set -euo pipefail

          # Private GHCR images (e.g. ghcr.io/ebpro/solen) are not pullable anonymously:
          # authenticate with the org PAT (has read access to the package); docker login
          # exchanges it for a short-lived pull token.
          if [[ "$QUARTO_IMAGE" == ghcr.io/* ]] && [ -n "$EBPRO_CI_PAT" ]; then
            echo "$EBPRO_CI_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          fi

          # Inner container command. Kept as a single-quoted string so the outer step
          # shell performs NO expansion on it; the render profile is injected via the
          # PROFILE env var (see DOCKER_RUN_ARGS) and expanded by the inner shell. This
          # keeps the command we log identical to the command we execute.
          #
          # Pre-render diagnostics are deliberately non-fatal: they only report what is
          # actually present on PATH (never inventing a binary path) and cannot abort the
          # render, so a missing/stalled browser shows up in the log without hiding the
          # real render outcome.
          RENDER_CMD='
            # [diag] Resolve the Chromium binary headless render would use, when present.
            for c in chromium chromium-browser google-chrome; do
              if command -v "$c" >/dev/null 2>&1; then
                echo "[diag] chromium candidate on PATH: $c -> $(command -v "$c")"
                "$c" --version 2>&1 | head -n1 || true
              fi
            done
            command -v chromium >/dev/null 2>&1 || echo "[diag] no chromium binary found on PATH"
            echo "[diag] quarto: $(quarto --version 2>&1 || true)"
            # sdkman-init so sdkman language tools (e.g. java for IJava) are on PATH.
            # stderr is left VISIBLE (no blanket suppression) so a stall is diagnosable;
            # non-fatal when sdkman is absent.
            source /home/jovyan/.sdkman/bin/sdkman-init.sh || true
            quarto render --profile "$PROFILE"
          '

          IFS=',' read -ra PROFILE_LIST <<< "$PROFILES"
          for p in "${PROFILE_LIST[@]}"; do
            echo "Rendering profile: $p"

            DOCKER_RUN_ARGS=(
              --rm
              -v "$GITHUB_WORKSPACE":/workdir
              -w /workdir
              # Pin the helper directory contract consumed by jupyter-base's helper
              # scripts (get_src_dir.sh / gitpull.sh): NB_USER, WORK_DIR and
              # EXAMPLES_DIR are set explicitly so git clones and static includes
              # resolve to the same /home/jovyan/work paths in every render mode
              # (nested DinD, socket bridge, none), independent of container $HOME.
              -e NB_USER=jovyan
              -e WORK_DIR=/home/jovyan/work
              -e EXAMPLES_DIR=/home/jovyan/work/examples
              # Profile passed as an env var so RENDER_CMD can stay a plain single-quoted
              # string with no outer-shell expansion (see above).
              -e PROFILE="$p"
            )

            if [ "$NESTED_DIND_ENABLED" = "true" ]; then
              # Nested DinD mode: the render container runs on the caller/runner daemon,
              # but its `docker` CLI (and thus notebook docker commands) target the
              # isolated nested DinD daemon over TLS at tcp://dind:2376. The caller
              # /var/run/docker.sock is deliberately NOT mounted in this mode.
              echo "Nested DinD mode enabled: render container will talk to tcp://dind:2376"
              DOCKER_RUN_ARGS+=(
                --network "$NESTED_DIND_NETWORK"
                -v "$NESTED_DIND_CERT_DIR":/certs/client:ro
                -e DOCKER_HOST=tcp://dind:2376
                -e DOCKER_TLS_VERIFY=1
                -e DOCKER_CERT_PATH=/certs/client
              )
            elif [ -S /var/run/docker.sock ]; then
              # Legacy dind socket bridge: when a dind socket is present and nested mode
              # is disabled, bridge /var/run/docker.sock into the render container and
              # grant the render user (uid 1000) access to the socket's group; the gid
              # is read at runtime so it stays correct if it drifts. Also alias the name
              # `dind` to the host gateway so published ports (e.g. `docker run -p
              # 8080:80`) are reachable from the notebook as `http://dind:<port>`.
              echo "Docker socket bridge mode enabled"
              DOCKER_RUN_ARGS+=(
                -v /var/run/docker.sock:/var/run/docker.sock
                -e DOCKER_HOST=unix:///var/run/docker.sock
                --group-add "$(stat -c '%g' /var/run/docker.sock)"
                --add-host dind:host-gateway
              )
            else
              echo "No Docker socket found: rendering without Docker access"
            fi

            # Forward runner proxy env vars into the render container. Only vars
            # actually set are forwarded; NO_PROXY is always the merged value
            # (internal endpoints) so dind/harbor/nexus bypass the proxy.
            if [ "${PROXY_PRESENT:-false}" = "true" ]; then
              for v in HTTP_PROXY HTTPS_PROXY http_proxy https_proxy; do
                if [ -n "${!v:-}" ]; then
                  DOCKER_RUN_ARGS+=("-e" "$v=${!v}")
                fi
              done
              DOCKER_RUN_ARGS+=("-e" "NO_PROXY=${MERGED_NO_PROXY}")
              DOCKER_RUN_ARGS+=("-e" "no_proxy=${MERGED_NO_PROXY}")
              echo "Forwarding proxy env vars into render container"
            fi

            # Log a reproducible-but-redacted view of the resolved command. Env values
            # that may carry credentials (proxy URLs) and NO_PROXY are replaced with
            # <redacted> so the log keeps the image, mounts, env keys and command
            # structure without leaking secrets. The org PAT is never in
            # DOCKER_RUN_ARGS (it is consumed by `docker login` above, not passed into
            # the container). Proxy forwarding remains visible via the env key names.
            LOG_ARGS=()
            i=0
            n=${#DOCKER_RUN_ARGS[@]}
            while [ "$i" -lt "$n" ]; do
              a="${DOCKER_RUN_ARGS[$i]}"
              if [ "$a" = "-e" ] && [ "$((i + 1))" -lt "$n" ]; then
                kv="${DOCKER_RUN_ARGS[$((i + 1))]}"
                k="${kv%%=*}"
                case "$k" in
                  HTTP_PROXY|HTTPS_PROXY|http_proxy|https_proxy|NO_PROXY|no_proxy)
                    LOG_ARGS+=("-e" "${k}=<redacted>")
                    ;;
                  *)
                    LOG_ARGS+=("-e" "$kv")
                    ;;
                esac
                i=$((i + 2))
              else
                LOG_ARGS+=("$a")
                i=$((i + 1))
              fi
            done

            echo "==> docker run ${LOG_ARGS[*]}"
            echo "==>   image: $QUARTO_IMAGE"
            echo "==>   inner shell: bash -lc <RENDER_CMD>, PROFILE=$p"

            docker run "${DOCKER_RUN_ARGS[@]}" \
              "$QUARTO_IMAGE" \
              bash -lc "$RENDER_CMD"
          done

      - name: Clean up isolated DinD
        if: always() && steps.nested_dind.outputs.enabled == 'true'
        env:
          DIND_CONTAINER: ${{ steps.nested_dind.outputs.dind_container }}
          DIND_NETWORK: ${{ steps.nested_dind.outputs.dind_network }}
        run: |
          if [ -n "${DIND_CONTAINER:-}" ]; then
            docker rm -f "$DIND_CONTAINER" >/dev/null 2>&1 || true
          fi
          if [ -n "${DIND_NETWORK:-}" ]; then
            docker network rm "$DIND_NETWORK" >/dev/null 2>&1 || true
          fi
          echo "Isolated DinD cleanup complete"

      - name: Package rendered output
        id: package
        run: |
          cd "${{ github.workspace }}/_output"
          python3 -c "
          import zipfile, os
          zf = zipfile.ZipFile('${{ github.workspace }}/site-zip.zip', 'w', zipfile.ZIP_DEFLATED)
          for root, dirs, files in os.walk('.'):
              for f in files:
                  p = os.path.join(root, f)
                  zf.write(p)
          zf.close()
          print(f'Created zip: {os.path.getsize(\"${{ github.workspace }}/site-zip.zip\")} bytes')
          "
          echo "site-name=site-zip" >> "$GITHUB_OUTPUT"

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-zip
          path: site-zip.zip
          retention-days: 7

  deploy:
    needs: render
    if: inputs.deploy && github.event_name == 'push'
    runs-on: [self-hosted, linux, ebpro-org, x64]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-zip
          path: site-zip

      - name: Unpack site
        run: |
          mkdir -p site
          cd site-zip
          unzip -o site-zip.zip -d ../site
          echo "Site ready: $(find ../site -type f | wc -l) files"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
