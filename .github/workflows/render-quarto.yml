name: Render Quarto Documents (reusable)

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      profiles:
        description: 'Comma-separated list of profiles to render (e.g. notes,slides)'
        required: false
        type: string
        default: 'notes,slides'
      quarto-image:
        description: 'Docker image to use for Quarto (must include `quarto` CLI)'
        required: false
        type: string
        default: 'harbor.ebruno.fr/ghcr-p2c/ebpro/solen:quarto-full-chore-add-pyproject'
      utils-repo:
        description: 'Repository that provides shared Quarto utils (owner/repo)'
        required: false
        type: string
        default: 'ebpro/_quarto-utils'
      utils-ref:
        description: 'Ref (branch or tag) of the utils repo to checkout'
        required: false
        type: string
        default: 'main'
      output-path:
        description: 'Path to output artifacts (glob-friendly)'
        required: false
        type: string
        default: '_output'
      deploy-pages:
        description: 'Deploy to GitHub Pages (main branch only)'
        required: false
        type: boolean
        default: true
      deploy-cloudflare:
        description: 'Deploy to Cloudflare Pages preview (non-main branches)'
        required: false
        type: boolean
        default: true
      deploy-static:
        description: 'DORMANT: déploiement vers le serveur personnel via rsync (opt-in par wrapper)'
        required: false
        type: boolean
        default: false
      cf-project-name:
        description: 'Cloudflare Pages project name (default: derive from repo name)'
        required: false
        type: string
        default: ''
      enable-docker:
        description: 'Mount the host Docker socket so docker cells render live (dooD)'
        required: false
        type: boolean
        default: false

concurrency:
  group: render-${{ github.event.repository.full_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    timeout-minutes: 90
    runs-on: [self-hosted, linux, ebpro-org, x64]
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository (caller) with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.EBPRO_CI_PAT || secrets.GITHUB_TOKEN }}

      - name: Clear submodule-populated utils (re-checkout at desired ref)
        run: rm -rf _quarto-utils

      - name: Checkout utilities repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.utils-repo }}
          ref: ${{ inputs.utils-ref }}
          path: _quarto-utils
          token: ${{ secrets.EBPRO_CI_PAT || secrets.GITHUB_TOKEN }}

      - name: Create compatibility symlink
        run: ln -s _quarto-utils quarto-utils

      - name: Cache restore (validate)
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/quarto-cache-canary
          key: quarto-render-${{ runner.os }}-${{ inputs.quarto-image }}
          restore-keys: |
            quarto-render-${{ runner.os }}-

      - name: Cache canary marker
        run: |
          mkdir -p /tmp/quarto-cache-canary
          if [ "${{ steps.cache-restore.outputs.cache-hit }}" = "true" ]; then
            echo "✅ CACHE HIT — previous marker:"
            cat /tmp/quarto-cache-canary/marker.txt
          else
            echo "ℹ️  CACHE MISS — first run for this key, will be saved"
          fi
          echo "ts=$(date -u +%Y%m%dT%H%M%SZ) run=${{ github.run_id }}" > /tmp/quarto-cache-canary/marker.txt
          cat /tmp/quarto-cache-canary/marker.txt

      - name: Detect Docker socket
        run: |
          if [ -S /var/run/docker.sock ]; then
            SOCKET_GID=$(stat -c %g /var/run/docker.sock 2>/dev/null || stat -f %g /var/run/docker.sock 2>/dev/null)
            echo "DOCKER_MOUNTS=-v /var/run/docker.sock:/var/run/docker.sock --group-add ${SOCKET_GID:-0}" >> "$GITHUB_ENV"
            echo "✅ Docker socket detected (gid=${SOCKET_GID}) — container will have Docker access"
          else
            echo "DOCKER_MOUNTS=" >> "$GITHUB_ENV"
            echo "ℹ️ No Docker socket — rendering without Docker access"
          fi

      - name: Render with Quarto (Docker)
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILES: ${{ inputs.profiles }}
          QUARTO_IMAGE: ${{ inputs.quarto-image }}
          EBPRO_CI_PAT: ${{ secrets.EBPRO_CI_PAT }}
          ENABLE_DOCKER: ${{ inputs.enable-docker }}
          RUN_ID: ${{ github.run_id }}
          DEPLOY_STATIC: ${{ inputs.deploy-static }}
          TEACHING_BASE_URL: ${{ secrets.TEACHING_BASE_URL }}
        run: |
          RENDER_CONTAINER="quarto-render-${RUN_ID}"
          # Extra docker-run args. The base env and the 'dind' host mapping are
          # UNCONDITIONAL; only the docker-socket (dooD) bits are appended when
          # enable-docker=true. With enable-docker=false the run stays free of any
          # socket mount / DOCKER_HOST env (as before dooD existed).
          DOCKER_ARGS=()
          # Unconditional: aligns gitpull.sh / get_src_dir.sh examples base path
          # so `cd` into the cloned examples works in both dooD and non-dooD renders.
          DOCKER_ARGS+=(-e EXAMPLES_DIR=/home/jovyan/work)
          DOCKER_ARGS+=(-e CI=true)
          # Unconditional: map 'dind' -> host-gateway so the render container can
          # resolve services that run on the runner host (e.g. a postgres started
          # with --network host). Reaching a host service only needs this hosts
          # entry, which is independent of dooD (docker socket mount) — it must
          # apply even when enable-docker=false, otherwise the JVM gets
          # UnknownHostException: dind.
          DOCKER_ARGS+=(--add-host dind:host-gateway)
          if [ "$ENABLE_DOCKER" = "true" ]; then
            # Skip socket mount in DOCKER_ARGS when DOCKER_MOUNTS (auto-detect step) already provides it
            if [ -z "${DOCKER_MOUNTS:-}" ]; then
              DOCKER_ARGS+=(-v /var/run/docker.sock:/var/run/docker.sock)
            fi
            DOCKER_ARGS+=(-e DOCKER_HOST=unix:///var/run/docker.sock)
          fi
          # Keep the existing render-container removal, plus a best-effort sweep of
          # any lecture containers this run left behind (label=ebpro-render=true).
          # Both removals are non-fatal (|| true) so cleanup never masks the render result.
          trap 'docker rm -f "$RENDER_CONTAINER" >/dev/null 2>&1 || true; docker ps -aq --filter "label=ebpro-render=true" | xargs -r docker rm -f || true' EXIT
          if [[ "$QUARTO_IMAGE" == ghcr.io/* ]] && [ -n "$EBPRO_CI_PAT" ]; then
            echo "$EBPRO_CI_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          fi
          # dooD canary: before spending a render, verify the host daemon is reachable
          # from inside the image. Fails fast on a missing docker CLI or unmounted socket.
          # Runs after the ghcr.io login above so a private image pull still succeeds.
          if [ "$ENABLE_DOCKER" = "true" ]; then
            echo ">> dooD canary: verifying host Docker daemon reachability"
            if docker run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock \
                -e DOCKER_HOST=unix:///var/run/docker.sock \
                "$QUARTO_IMAGE" \
                bash -lc 'docker --version && docker info --format "{{.ServerVersion}}" && echo "daemon OK"'; then
              echo "✅ dooD canary passed (host daemon reachable)"
            else
              echo "daemon UNREACHABLE"
              echo "::error::dooD canary FAILED: host Docker daemon unreachable (missing docker CLI in image, or /var/run/docker.sock not mounted)"
              exit 1
            fi
          fi
          # --- DORMANT deploy-static: injection de baseurl ------------------------
          # Quand le wrapper opte (deploy-static=true), on calcule un baseurl ancré
          # sur l'emplacement par dépôt / par branche du serveur personnel et on
          # l'ajoute à la commande de rendu quarto. Quand deploy-static n'est pas
          # "true" (la valeur par défaut), BASEURL_ARG reste vide et la commande
          # quarto est inchangée byte pour byte.
          BASEURL_ARG=""
          if [ "$DEPLOY_STATIC" = "true" ]; then
            if [ -z "$TEACHING_BASE_URL" ]; then
              echo "::error::deploy-static=true mais le secret d'org TEACHING_BASE_URL est vide; impossible de calculer baseurl"
              exit 1
            fi
            # BASEPATH = TEACHING_BASE_URL sans scheme://host (ex. /teaching-material)
            BASEPATH="$(printf '%s' "$TEACHING_BASE_URL" | sed -E 's#^[a-zA-Z][a-zA-Z0-9+.-]*://[^/]+##; s#/$##')"
            # REPO = nom court du dépôt (owner/repo -> repo)
            REPO="$(basename "$GITHUB_REPOSITORY")"
            # SUBPATH depuis GITHUB_REF :
            #   refs/heads/develop   -> develop
            #   refs/heads/<branche> -> <branche> (les barres internes restent des répertoires imbriqués)
            #   refs/tags/<tag>      -> releases/<tag>
            #   autre                -> erreur
            case "$GITHUB_REF" in
              refs/heads/develop)
                SUBPATH="develop"
                ;;
              refs/heads/*)
                SUBPATH="${GITHUB_REF#refs/heads/}"
                ;;
              refs/tags/*)
                SUBPATH="releases/${GITHUB_REF#refs/tags/}"
                ;;
              *)
                echo "::error::deploy-static=true mais GITHUB_REF '$GITHUB_REF' n'est ni une branche ni un tag; rendu avec baseurl refusé"
                exit 1
                ;;
            esac
            if [ -z "$SUBPATH" ]; then
              echo "::error::SUBPATH vide pour GITHUB_REF '$GITHUB_REF'; rendu avec baseurl refusé"
              exit 1
            fi
            BASEURL="${BASEPATH}/${REPO}/${SUBPATH}/"
            echo "ℹ️  deploy-static: BASEURL=$BASEURL"
            BASEURL_ARG=" --metadata baseurl=$BASEURL"
          fi
          # -----------------------------------------------------------------------
          IFS=',' read -ra PROFILE_LIST <<< "$PROFILES"
          for p in "${PROFILE_LIST[@]}"; do
            echo "Rendering profile: $p"
            docker run --rm $DOCKER_MOUNTS --name "$RENDER_CONTAINER" \
              -v "$GITHUB_WORKSPACE":/workdir \
              -w /workdir \
              "${DOCKER_ARGS[@]}" \
              "$QUARTO_IMAGE" \
              bash -lc "source /home/jovyan/.sdkman/bin/sdkman-init.sh 2>/dev/null || source \$HOME/.sdkman/bin/sdkman-init.sh 2>/dev/null || true; quarto render --profile '$p'$BASEURL_ARG"
          done

      - name: Package rendered output
        run: |
          OUT_DIR="${{ github.workspace }}/${{ inputs.output-path }}"
          if [ ! -d "$OUT_DIR" ]; then
            echo "::error::Output dir not found: $OUT_DIR — render produced nothing; refusing to deploy an empty site"
            exit 1
          fi
          FILE_COUNT=$(find "$OUT_DIR" -type f | wc -l)
          echo "Packaging $FILE_COUNT files from $OUT_DIR"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::Output dir is empty: $OUT_DIR — refusing to deploy an empty site"
            exit 1
          fi
          cd "$OUT_DIR"
          python3 -c "
          import zipfile, os
          zf = zipfile.ZipFile('${{ github.workspace }}/site-zip.zip', 'w', zipfile.ZIP_DEFLATED)
          for root, dirs, files in os.walk('.'):
              for f in files:
                  p = os.path.join(root, f)
                  zf.write(p)
          zf.close()
          print(f'Created zip: {os.path.getsize(\"${{ github.workspace }}/site-zip.zip\")} bytes')
          "

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-zip
          path: site-zip.zip
          retention-days: 7

      - name: Cache save (validate)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/quarto-cache-canary
          key: quarto-render-${{ runner.os }}-${{ inputs.quarto-image }}

  deploy-pages:
    needs: render
    if: inputs.deploy-pages && github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15
    runs-on: [self-hosted, linux, ebpro-org, x64]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-zip
          path: site-zip

      - name: Unpack site
        run: |
          mkdir -p site
          cd site-zip
          unzip -o site-zip.zip -d ../site
          echo "Site ready: $(find ../site -type f | wc -l) files"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Announce
        run: |
          echo "✅ Stable deployment live: https://${{ github.repository_owner }}.github.io/$(basename "${{ github.repository }}")/"

  deploy-cloudflare:
    needs: render
    if: inputs.deploy-cloudflare && github.ref != 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15
    runs-on: [self-hosted, linux, ebpro-org, x64]
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-zip
          path: site-zip

      - name: Unpack site
        run: |
          mkdir -p site
          cd site-zip
          unzip -o site-zip.zip -d ../site
          echo "Site ready: $(find ../site -type f | wc -l) files"

      - name: Deploy to Cloudflare Pages (preview)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT: ${{ inputs.cf-project-name }}
          REPO_NAME: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CF_API_TOKEN secret is not set or not visible to this repo; cannot deploy preview"
            exit 1
          fi
          # Derive + sanitize project name (CF Pages requires ^[a-z0-9][a-z0-9-]{0,62}$)
          PROJECT="${CF_PROJECT}"
          if [ -z "$PROJECT" ]; then
            PROJECT="$(echo "$REPO_NAME" | sed 's|.*/||' | tr 'A-Z' 'a-z' | tr '_' '-')"
          fi
          if ! echo "$PROJECT" | grep -Eq '^[a-z0-9][a-z0-9-]{0,62}$'; then
            echo "::error::Derived CF project name '$PROJECT' is invalid (must match ^[a-z0-9][a-z0-9-]{0,62}\$). Set cf-project-name explicitly in the wrapper."
            exit 1
          fi

          echo "Deploying to Cloudflare Pages project: $PROJECT (branch: $BRANCH)"

          # Ensure the CF Pages project exists (idempotent, silent on re-deploys).
          # The project is checked via the CF API first so `wrangler pages project
          # create` (which hard-fails with 8000002 when the project already exists)
          # only runs on the FIRST deploy. The account is resolved from
          # CLOUDFLARE_API_TOKEN the same way wrangler auto-detects it, so no
          # CLOUDFLARE_ACCOUNT_ID is needed.
          ACCOUNT_ID="$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/accounts \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["result"][0]["id"])')"
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Could not resolve Cloudflare account from CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          CF_PROJECT_STATUS="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT")"
          if [ "$CF_PROJECT_STATUS" = "200" ]; then
            echo "CF Pages project '$PROJECT' already exists; skipping creation"
          elif [ "$CF_PROJECT_STATUS" = "404" ]; then
            echo "CF Pages project '$PROJECT' not found; creating it"
            npx --yes wrangler@4.146.0 pages project create "$PROJECT" --production-branch=develop
          else
            echo "::error::Unexpected HTTP $CF_PROJECT_STATUS while checking CF Pages project '$PROJECT'"
            exit 1
          fi

          # Deploy using wrangler
          npx --yes wrangler@4.146.0 pages deploy ./site \
            --project-name="$PROJECT" \
            --commit-hash="$SHA" \
            --branch="$BRANCH" \
            --commit-message="CI deploy: $BRANCH @ ${SHA:0:7}"

          echo ""
          echo "🔍 Preview deployment complete for branch: $BRANCH"
          echo "   URL will be printed above by wrangler (format: https://<hash>--$PROJECT.pages.dev)"

  deploy-static:
    needs: render
    if: inputs.deploy-static && github.event_name == 'push'
    timeout-minutes: 15
    runs-on: [self-hosted, linux, ebpro-org, x64]
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-zip
          path: site-zip

      - name: Unpack site
        run: |
          mkdir -p site
          cd site-zip
          unzip -o site-zip.zip -d ../site
          FILE_COUNT=$(find ../site -type f | wc -l)
          echo "Site prêt : $FILE_COUNT fichiers"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::site/ contient 0 fichier après unzip — déploiement d'un site vide refusé"
            exit 1
          fi

      - name: Compute target path (REPO + SUBPATH)
        run: |
          REPO="$(basename "$GITHUB_REPOSITORY")"
          # MÊME règle de SUBPATH que l'injection de baseurl dans le job render.
          case "$GITHUB_REF" in
            refs/heads/develop)
              SUBPATH="develop"
              ;;
            refs/heads/*)
              SUBPATH="${GITHUB_REF#refs/heads/}"
              ;;
            refs/tags/*)
              SUBPATH="releases/${GITHUB_REF#refs/tags/}"
              ;;
            *)
              echo "::error::GITHUB_REF '$GITHUB_REF' n'est ni une branche ni un tag; déploiement refusé"
              exit 1
              ;;
          esac
          if [ -z "$REPO" ] || [ -z "$SUBPATH" ]; then
            echo "::error::REPO ou SUBPATH vide (REPO='$REPO' SUBPATH='$SUBPATH'); déploiement refusé"
            exit 1
          fi
          # SÉCURITÉ (règle n°1 — aucune suppression accidentelle) : la portée de
          # --delete DOIT être exactement teaching-material/$REPO/$SUBPATH/. On refuse
          # si le chemin de destination n'a pas au moins 3 composants (teaching-material
          # / REPO / SUBPATH). Jamais teaching-material/ seul, jamais teaching-material/$REPO/.
          DEST_PATH="teaching-material/$REPO/$SUBPATH"
          COMPONENT_COUNT="$(printf '%s' "$DEST_PATH" | awk -F'/' '{n=0; for(i=1;i<=NF;i++) if($i!="") n++; print n}')"
          if [ "$COMPONENT_COUNT" -lt 3 ]; then
            echo "::error::Vérification de sécurité échouée : '$DEST_PATH' a moins de 3 composants (teaching-material/REPO/SUBPATH) ; rsync --delete refusé"
            exit 1
          fi
          echo "REPO=$REPO" >> "$GITHUB_ENV"
          echo "SUBPATH=$SUBPATH" >> "$GITHUB_ENV"
          echo "Cible de déploiement : bruno@vai.univ-tln.fr:teaching-material/$REPO/$SUBPATH/"

      - name: Write SSH key
        env:
          TEACHING_DEPLOY_SSH_KEY: ${{ secrets.TEACHING_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$TEACHING_DEPLOY_SSH_KEY" ]; then
            echo "::error::Le secret TEACHING_DEPLOY_SSH_KEY n'est pas défini ou n'est pas visible par ce dépôt ; déploiement impossible"
            exit 1
          fi
          KEY="$(mktemp /tmp/teaching-deploy-key.XXXXXX)"
          printf '%s\n' "$TEACHING_DEPLOY_SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          echo "KEY=$KEY" >> "$GITHUB_ENV"

      - name: Ensure rsync is available
        run: |
          set -euo pipefail
          if command -v rsync >/dev/null 2>&1; then
            echo "rsync already present: $(rsync --version | head -n1)"; exit 0
          fi
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          if command -v apt-get >/dev/null 2>&1; then
            $SUDO apt-get update -y && $SUDO apt-get install -y rsync
          elif command -v apk >/dev/null 2>&1; then
            $SUDO apk add --no-cache rsync
          elif command -v dnf >/dev/null 2>&1; then
            $SUDO dnf install -y rsync
          elif command -v yum >/dev/null 2>&1; then
            $SUDO yum install -y rsync
          else
            echo "::error::rsync missing and no supported package manager (apt-get/apk/dnf/yum) found"
            exit 1
          fi
          echo "Installed: $(rsync --version | head -n1)"

      - name: rsync to personal server (scoped --delete)
        run: |
          # Re-vérification de sécurité juste avant le rsync destructif.
          if [ -z "$SUBPATH" ]; then
            echo "::error::Vérification de sécurité échouée : SUBPATH vide ; rsync --delete refusé"
            exit 1
          fi
          DEST="teaching-material/$REPO/$SUBPATH/"
          echo "Portée de rsync --delete : bruno@vai.univ-tln.fr:$DEST"
          rsync -az --delete --mkpath -e "ssh -i $KEY -o StrictHostKeyChecking=accept-new" site/ "bruno@vai.univ-tln.fr:$DEST"
          echo "✅ rsync terminé : bruno@vai.univ-tln.fr:$DEST"

      - name: Write root placeholder index.html
        run: |
          DEST_DIR="teaching-material/$REPO"
          # Écrasement d'UN SEUL fichier à la racine du dépôt (SANS --delete, SANS sync de répertoire).
          ssh -i "$KEY" -o StrictHostKeyChecking=accept-new bruno@vai.univ-tln.fr "mkdir -p $DEST_DIR && cat > $DEST_DIR/index.html" <<'INDEX_HTML_EOF'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Aucune version stable publique</title>
          <style>
          body { font-family: system-ui, -apple-system, sans-serif; margin: 4rem auto; max-width: 40rem; padding: 0 1rem; color: #1f2328; }
          h1 { font-size: 1.5rem; }
          a { color: #0969da; }
          </style>
          </head>
          <body>
          <h1>Aucune version stable publique</h1>
          <p>Aucune version de ce dépôt n'est déployée au niveau racine. Consultez une branche pour voir un rendu :</p>
          <ul>
          <li><a href="develop/">develop</a></li>
          </ul>
          </body>
          </html>
          INDEX_HTML_EOF
          echo "✅ Placeholder écrit : bruno@vai.univ-tln.fr:$DEST_DIR/index.html"

      - name: Clean up SSH key
        if: always()
        run: |
          if [ -n "${KEY:-}" ]; then
            rm -f "$KEY"
          fi
