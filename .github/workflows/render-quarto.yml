# v1.3.35: site-zip artifact lifecycle — 1-day retention floor at upload + purge after a successful deploy-static rsync (Team-plan 2 GiB artifact quota).
# v1.3.31-candidate: hang watchdog for the render step (input hang-detection-minutes, default 0 = off).
name: Render Quarto Documents (reusable)

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      profiles:
        description: 'Comma-separated list of profiles to render (e.g. notes,slides)'
        required: false
        type: string
        default: 'notes,slides'
      quarto-image:
        description: 'Docker image to use for Quarto (must include `quarto` CLI)'
        required: false
        type: string
        default: 'harbor.ebruno.fr/ghcr-p2c/ebpro/solen:quarto-full-chore-add-pyproject'
      utils-repo:
        description: 'Repository that provides shared Quarto utils (owner/repo)'
        required: false
        type: string
        default: 'ebpro/_quarto-utils'
      utils-ref:
        description: 'Ref (branch or tag) of the utils repo to checkout'
        required: false
        type: string
        default: 'main'
      output-path:
        description: 'Path to output artifacts (glob-friendly)'
        required: false
        type: string
        default: '_output'
      deploy-static:
        description: 'DORMANT: déploiement vers le serveur personnel via rsync (opt-in par wrapper)'
        required: false
        type: boolean
        default: false
      enable-docker:
        description: 'Mount the host Docker socket so docker cells render live (dooD)'
        required: false
        type: boolean
        default: false
      slides-pdf:
        description: "Export revealjs decks to PDF via decktape (warn-only)"
        type: boolean
        default: false
      render-timeout-minutes:
        description: 'Hard cap (minutes) on the "Render with Quarto (Docker)" step. Default 75 (v1.3.30, was 60: containers-intro-class hung at the 60-min ceiling on a slow-pull day). Raise per-wrapper only for known-slow content (e.g. DEV-ADV 90).'
        required: false
        type: number
        default: 75
      hang-detection-minutes:
        description: 'v1.3.31-candidate: inactivity cap (minutes) on the render stream log (hang watchdog sidecar). 0 (default) = disabled, zero blast radius. Must be < render-timeout-minutes. Raise per-repo only for known long-silent-cell content; converts a 75-min blind hang into a fast, forensically-annotated failure.'
        required: false
        type: number
        default: 0
      freeze:
        description: 'v1.3.25: enable the cell-output freeze cache (restore/save of _freeze + .quarto under actions/cache scope quarto-freeze, keyed by image digest + quarto version + content snapshot). Runtime opt-in is an UNTRACKED root _metadata.yml (execute.freeze: auto) written on non-PR runs. v1.3.27: default switched to FALSE — pins must not silently adopt the freeze machinery; wrappers opt in explicitly with `freeze: true`. Set false (default) to force full cold execution.'
        required: false
        type: boolean
        default: false
      site-transport:
        description: 'Handoff render to deploy: artifact | staging | both. staging = vai ~/teaching-staging (quota-immune); both = dual-write transition; default artifact = inert (existing behavior unchanged).'
        required: false
        type: string
        default: 'artifact'
      seo-directives:
        description: 'Index directives on deployed HTML (default-on): push to the DEFAULT branch (develop/ family) -> website.site-url + format.html.canonical-url (Quarto emits the canonical link + a per-repo sitemap.xml); push to any OTHER branch (previews/<slug>/ family) -> <meta name="robots" content="noindex, follow"> on the rendered HTML/Revealjs pages. Tags/releases get NO directive (release canonical strategy pending fleet v-tag adoption); pull_request renders are skipped entirely. Set false per-wrapper to opt out.'
        required: false
        type: boolean
        default: true

concurrency:
  group: render-${{ github.event.repository.full_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    # Job ceiling is a FIXED literal 120 = worst-supported render cap (90)
    # + 30 min headroom for checkout/cache/packaging/upload steps.
    # Deliberately NOT an expression: the Actions service historically rejects
    # the `inputs` context in job-level timeout-minutes of reusable workflows
    # (actions/runner#1555), failing the run at preparation time with 0 jobs.
    # The render cap itself is governed per-wrapper via the step-level
    # `render-timeout-minutes` input below; the job timer is only the outer
    # safety net. Wrappers must keep render-timeout-minutes <= 90.
    timeout-minutes: 120
    runs-on: [self-hosted, linux, ebpro-org, x64]
    permissions:
      contents: read
      actions: write
    outputs:
      # v1.3.35: id of the uploaded site-zip artifact; consumed by the
      # "Purge website artifact (post-deploy)" step of deploy-static.
      # Empty if the upload step did not run or failed (purge self-skips then
      # and the 1-day retention floor reclaims the space).
      site-artifact-id: ${{ steps.upload-site.outputs.artifact-id }}
      # Staging handoff (Model B): empty while site-transport=artifact (the
      # gated staging steps never run) — purely additive, no existing consumer
      # reads these. staging-zip is redundancy only; deploy-side consumers MUST
      # re-derive paths from staging-dir (validated at both ends).
      staging-dir: ${{ steps.staging-export.outputs.staging-dir }}
      staging-zip: ${{ steps.staging-export.outputs.staging-zip }}
      staging-sha256: ${{ steps.staging-export.outputs.staging-sha256 }}
      staging-ready: ${{ steps.staging-export.outputs.staging-ready }}
    steps:
      - name: Checkout repository (caller) with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.EBPRO_CI_PAT || secrets.GITHUB_TOKEN }}

      - name: Clear submodule-populated utils (re-checkout at desired ref)
        run: rm -rf _quarto-utils

      - name: Checkout utilities repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.utils-repo }}
          ref: ${{ inputs.utils-ref }}
          path: _quarto-utils
          token: ${{ secrets.EBPRO_CI_PAT || secrets.GITHUB_TOKEN }}

      - name: Create compatibility symlink
        run: ln -s _quarto-utils quarto-utils

      # ------------------------------------------------------------------
      # v1.3.25 — cell-output freeze cache (replaces the v1.3.x canary
      # marker cache, which validated the actions/cache plumbing but cached
      # nothing useful). Restore/save of the caller workspace's _freeze +
      # .quarto under scope `quarto-freeze`, exact key:
      #   qfreeze-v1-<runner.os>-<image digest>-<quarto version>-<snapshot>
      # snapshot = sha256(caller HEAD + recursive submodule status), so any
      # content change moves to a new exact key while the two restore-keys
      # prefixes keep runs warm across content changes (digest-scoped).
      # Render-level opt-in is the untracked runtime _metadata.yml
      # (execute.freeze: auto) written below; _quarto.yml keeps #freeze
      # commented and cache: true untouched (root _metadata.yml merges over
      # the shared project config — precedence verified 2026-10-13).
      # ------------------------------------------------------------------

      - name: Freeze cache key (image pull, digest, quarto version, snapshot hash)
        id: freeze-key
        # v1.3.30 (freeze machinery guard): skip entirely when freeze=false —
        # the docker pull/inspect/run and the summary section are pure
        # overhead for a cold render (fleet leak: jpa run 38849308298).
        if: inputs.freeze == true
        env:
          QUARTO_IMAGE: ${{ inputs.quarto-image }}
          EBPRO_CI_PAT: ${{ secrets.EBPRO_CI_PAT }}
        run: |
          set -uo pipefail
          # Best-effort local pull (with the same ghcr.io login the render
          # step performs) so `docker image inspect` can resolve a
          # RepoDigest on a cold runner. The render step pulls implicitly
          # anyway, so a failure here is a warning, not a hard error.
          if [[ "$QUARTO_IMAGE" == ghcr.io/* ]] && [ -n "${EBPRO_CI_PAT:-}" ]; then
            echo "$EBPRO_CI_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1 || true
          fi
          docker pull -q "$QUARTO_IMAGE" >/dev/null 2>&1 \
            || echo "::warning::freeze-key: docker pull of $QUARTO_IMAGE failed; falling back to the locally cached image (if any)"
          # Image digest = the identity that actually executed the cells.
          # The 'sha256:' prefix is stripped (actions/cache keys forbid
          # ':' ',' '*'); anything outside [A-Za-z0-9._-] is slugified in
          # both the digest and the tag fallback.
          DIGEST_REF="$(docker image inspect --format '{{index .RepoDigests 0}}' "$QUARTO_IMAGE" 2>/dev/null || true)"
          if [ -n "$DIGEST_REF" ]; then
            DIGEST="${DIGEST_REF##*@}"
          else
            DIGEST="tag-$QUARTO_IMAGE"
          fi
          DIGEST="$(printf '%s' "$DIGEST" | tr -cs 'A-Za-z0-9._-' '-')"
          DIGEST="${DIGEST%-}"
          # Quarto version: frozen cell outputs are only portable across the
          # same quarto build (freeze-file format assumptions). The solen CI
          # images have no ENTRYPOINT and quarto is on PATH (verified against
          # ghcr.io/ebpro/solen:quarto-full-build-20261010T172146Z).
          QVER="$(docker run --rm "$QUARTO_IMAGE" quarto --version 2>/dev/null | tr -d '[:space:]' || true)"
          [ -n "$QVER" ] || QVER="unknown"
          QVER="$(printf '%s' "$QVER" | tr -cs 'A-Za-z0-9._-' '-')"
          # Snapshot hash: caller HEAD + recursive submodule status. Both
          # are tracked-state only, so untracked runtime files written
          # later in this job (the _metadata.yml freeze override,
          # quarto-exec.log) cannot influence the key.
          SNAP_SRC="$(git rev-parse HEAD; git submodule status --recursive 2>/dev/null || true)"
          SNAP="$(printf '%s' "$SNAP_SRC" | sha256sum | cut -d' ' -f1)"
          {
            echo "digest=$DIGEST"
            echo "qver=$QVER"
            echo "snap=$SNAP"
          } >> "$GITHUB_OUTPUT"
          echo "freeze key parts: digest=$DIGEST qver=$QVER snap=$SNAP"
          {
            echo "### Freeze cache key"
            echo ""
            echo '```'
            echo "image    : $QUARTO_IMAGE"
            echo "digest   : $DIGEST"
            echo "quarto   : $QVER"
            echo "snapshot : $SNAP"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cold re-run detection
        id: cold-rerun
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # Attempt > 1 means a previous attempt died mid-render, so the
          # cache (and any workspace residue) may hold partial/corrupt
          # cells: skip the restore (see the restore step's if) and re-run
          # fully cold with maximum quarto diagnostics. RENDER_EXTRA_ARGS
          # expands host-side into the container command of the render step.
          if [ "${RUN_ATTEMPT:-1}" -gt 1 ]; then
            echo "rerun=true" >> "$GITHUB_OUTPUT"
            echo "RENDER_EXTRA_ARGS=--execute-debug --log-level debug" >> "$GITHUB_ENV"
            echo "ℹ️ re-run (attempt ${RUN_ATTEMPT}): freeze cache restore skipped, quarto debug diagnostics enabled"
          else
            echo "rerun=false" >> "$GITHUB_OUTPUT"
            echo "RENDER_EXTRA_ARGS=" >> "$GITHUB_ENV"
          fi

      - name: Stale workspace guard (pre-restore clean)
        # Self-hosted runner workspaces persist across runs and any residue
        # would poison both the render and the hit-detection below, so wipe
        # cacheable dirs and runtime metadata BEFORE the restore. This
        # realises the design's "rm -rf _freeze .quarto on restore-miss (and
        # always when freeze=false)" rule up-front with identical semantics:
        # whatever survives the restore comes from the cache, never from a
        # previous run.
        run: |
          set -uo pipefail
          rm -rf "$GITHUB_WORKSPACE/_freeze" "$GITHUB_WORKSPACE/.quarto"
          # Runtime freeze metadata hygiene: remove a stale UNTRACKED
          # _metadata.yml left by an earlier run; restore a COMMITTED one to
          # its tracked content in case an earlier run appended the freeze
          # block to it (duplicate `execute:` keys would break the YAML).
          if [ -f _metadata.yml ]; then
            if git ls-files --error-unmatch _metadata.yml >/dev/null 2>&1; then
              git checkout -- _metadata.yml 2>/dev/null || true
            else
              rm -f _metadata.yml
            fi
          fi
          git status --porcelain=v1 | head -20 || true

      - name: Freeze cache restore
        id: cache-restore
        # v1.3.30: was `if: github.run_attempt == 1` only — restore fired under
        # freeze:false, downloaded the cache (runtime "Cache hit for restore-key:
        # qfreeze-…") and restore-summary wiped it. Gate on the freeze input.
        if: inputs.freeze == true && github.run_attempt == 1
        # NOTE (v1.3.25 deviation): the design's `scope: quarto-freeze` is
        # NOT implementable — actions/cache restore/save declare no `scope`
        # input in any released version (verified against
        # restore/action.yml + save/action.yml at refs v4 and v6, and a
        # repo-wide code search). The cache service therefore scopes these
        # entries to this caller workflow (the default), which is exactly
        # the isolation the design wanted; keys stay collision-free via the
        # qfreeze-v1- prefix.
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/_freeze
            ${{ github.workspace }}/.quarto
          key: qfreeze-v1-${{ runner.os }}-${{ steps.freeze-key.outputs.digest }}-${{ steps.freeze-key.outputs.qver }}-${{ steps.freeze-key.outputs.snap }}
          restore-keys: |
            qfreeze-v1-${{ runner.os }}-${{ steps.freeze-key.outputs.digest }}-${{ steps.freeze-key.outputs.qver }}-
            qfreeze-v1-${{ runner.os }}-${{ steps.freeze-key.outputs.digest }}-

      - name: Freeze restore summary
        id: restore-summary
        if: inputs.freeze == true
        run: |
          set -uo pipefail
          HIT='${{ steps.cache-restore.outputs.cache-hit }}'
          MATCHED='${{ steps.cache-restore.outputs.cache-matched-key }}'
          # cache-hit is 'true' only for an exact primary-key match and can
          # be empty on a plain miss, so the classification also uses the
          # restored dirs (reliable: the pre-restore clean wiped the
          # workspace before the restore ran).
          RESULT=miss
          if [ "$HIT" = "true" ]; then
            RESULT=exact
          elif [ -d "$GITHUB_WORKSPACE/_freeze" ] || [ -d "$GITHUB_WORKSPACE/.quarto" ]; then
            RESULT=partial
          fi
          if [ '${{ inputs.freeze }}' != 'true' ]; then
            # freeze disabled for this run: restored cache data must not be
            # used (design rule 4 — always rm when freeze=false).
            rm -rf "$GITHUB_WORKSPACE/_freeze" "$GITHUB_WORKSPACE/.quarto"
            RESULT=miss
            echo "ℹ️ freeze=false — restored cache data wiped; full cold render"
          fi
          echo "restore-result=$RESULT" >> "$GITHUB_OUTPUT"
          case "$RESULT" in
            exact)   MSG="✅ CACHE HIT (exact key) — unchanged cells will not re-execute" ;;
            partial) MSG="🟡 CACHE PARTIAL HIT via restore-keys — changed cells will re-execute" ;;
            *)       MSG="ℹ️  CACHE MISS — first run for this key, will be saved on success" ;;
          esac
          echo "$MSG (matched-key: ${MATCHED:-<none>})"
          {
            echo "### Freeze cache restore"
            echo ""
            echo "$MSG"
            echo ""
            echo "- matched-key: \`${MATCHED:-<none>}\`"
            echo "- primary-key: \`${{ steps.cache-restore.outputs.cache-primary-key }}\`"
            echo ""
            echo '```'
            du -sh "$GITHUB_WORKSPACE/_freeze" "$GITHUB_WORKSPACE/.quarto" 2>/dev/null || echo "(no cache dirs present)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enable runtime freeze (untracked _metadata.yml)
        if: inputs.freeze == true && github.event_name != 'pull_request'
        run: |
          set -uo pipefail
          # execute.freeze: auto = reuse frozen cell outputs, re-execute only
          # cells whose content hash changed. Written as a RUNTIME-ONLY root
          # _metadata.yml (never committed; invisible to the snapshot hash,
          # which reads tracked state only). Quarto 1.10.18 has no
          # `--freeze`-style CLI flag for project freeze (verified against
          # the CI image: only `--use-freezer` for single-file incremental
          # renders), so the config route is the supported mechanism.
          if [ -f _metadata.yml ] && git ls-files --error-unmatch _metadata.yml >/dev/null 2>&1; then
            # The repo commits its own root _metadata.yml (e.g. the English
            # locale file in notebook-dev-web). Do NOT clobber it: append the
            # freeze block only when the committed file doesn't define
            # `execute:` itself; if it does, the repo owns execution policy.
            if grep -qE '^execute:' _metadata.yml; then
              echo "::notice::committed _metadata.yml already defines execute: — runtime freeze override skipped (repo owns execution policy)"
            else
              printf '\n# runtime freeze (CI-managed, workspace-only — do not treat as content)\nexecute:\n  freeze: auto\n' >> _metadata.yml
              echo "✅ appended execute.freeze: auto to committed _metadata.yml (dirty in the workspace only; never pushed)"
            fi
          else
            printf 'execute:\n  freeze: auto\n' > _metadata.yml
            echo "✅ wrote untracked runtime _metadata.yml (execute.freeze: auto)"
          fi
          cat _metadata.yml

      - name: Detect Docker socket
        run: |
          if [ -S /var/run/docker.sock ]; then
            SOCKET_GID=$(stat -c %g /var/run/docker.sock 2>/dev/null || stat -f %g /var/run/docker.sock 2>/dev/null)
            echo "DOCKER_MOUNTS=-v /var/run/docker.sock:/var/run/docker.sock --group-add ${SOCKET_GID:-0}" >> "$GITHUB_ENV"
            echo "✅ Docker socket detected (gid=${SOCKET_GID}) — container will have Docker access"
          else
            echo "DOCKER_MOUNTS=" >> "$GITHUB_ENV"
            echo "ℹ️ No Docker socket — rendering without Docker access"
          fi

      - name: Render with Quarto (Docker)
        # fromJSON() coercion guards against the caller→callee boundary
        # delivering the number input as a string ("Unexpected value '90'"
        # evaluation errors, actions/runner#1555 discussion).
        timeout-minutes: ${{ fromJSON(inputs.render-timeout-minutes) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILES: ${{ inputs.profiles }}
          QUARTO_IMAGE: ${{ inputs.quarto-image }}
          EBPRO_CI_PAT: ${{ secrets.EBPRO_CI_PAT }}
          ENABLE_DOCKER: ${{ inputs.enable-docker }}
          RUN_ID: ${{ github.run_id }}
          DEPLOY_STATIC: ${{ inputs.deploy-static }}
          TEACHING_BASE_URL: ${{ secrets.TEACHING_BASE_URL }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SEO_DIRECTIVES: ${{ inputs.seo-directives }}
        run: |
          RENDER_CONTAINER="quarto-render-${RUN_ID}"
          # Extra docker-run args. The base env and the 'dind' host mapping are
          # UNCONDITIONAL; only the docker-socket (dooD) bits are appended when
          # enable-docker=true. With enable-docker=false the run stays free of any
          # socket mount / DOCKER_HOST env (as before dooD existed).
          DOCKER_ARGS=()
          # Unconditional: aligns gitpull.sh / get_src_dir.sh examples base path
          # so `cd` into the cloned examples works in both dooD and non-dooD renders.
          DOCKER_ARGS+=(-e EXAMPLES_DIR=/home/jovyan/work)
          DOCKER_ARGS+=(-e CI=true)
          # Unconditional: map 'dind' -> host-gateway so the render container can
          # resolve services that run on the runner host (e.g. a postgres started
          # with --network host). Reaching a host service only needs this hosts
          # entry, which is independent of dooD (docker socket mount) — it must
          # apply even when enable-docker=false, otherwise the JVM gets
          # UnknownHostException: dind.
          DOCKER_ARGS+=(--add-host dind:host-gateway)
          if [ "$ENABLE_DOCKER" = "true" ]; then
            # Skip socket mount in DOCKER_ARGS when DOCKER_MOUNTS (auto-detect step) already provides it
            if [ -z "${DOCKER_MOUNTS:-}" ]; then
              DOCKER_ARGS+=(-v /var/run/docker.sock:/var/run/docker.sock)
            fi
            DOCKER_ARGS+=(-e DOCKER_HOST=unix:///var/run/docker.sock)
          fi
          # Keep the existing render-container removal, plus a best-effort sweep of
          # any lecture containers THIS run left behind.
          # v1.3.36: the sweep arm is scoped by the run-scoped label
          # ebpro-render-run=<run_id>-<attempt> (self-only). The v1.3.32 coarse
          # label + the v1.3.31+ unscoped sweep meant every run's EXIT trap deleted
          # ALL ebpro-render=true containers on the shared dooD daemon — including
          # live containers of concurrent runs (canary incident: notebook-containers-intro,
          # 3x exit-137; hazard real, actor unproven).
          # Both removals are non-fatal (|| true) so cleanup never masks the render result.
          # v1.3.31-candidate (hang watchdog): appended kill arm (kill first so the
          # sidecar can no longer act during teardown); original cleanup arms unchanged.
          trap 'kill "${WATCHDOG_PID:-}" 2>/dev/null || true; docker rm -f "$RENDER_CONTAINER" >/dev/null 2>&1 || true; docker ps -aq --filter "label=ebpro-render-run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | xargs -r docker rm -f || true' EXIT
          if [[ "$QUARTO_IMAGE" == ghcr.io/* ]] && [ -n "$EBPRO_CI_PAT" ]; then
            echo "$EBPRO_CI_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          fi
          # dooD canary: before spending a render, verify the host daemon is reachable
          # from inside the image. Fails fast on a missing docker CLI or unmounted socket.
          # Runs after the ghcr.io login above so a private image pull still succeeds.
          if [ "$ENABLE_DOCKER" = "true" ]; then
            echo ">> dooD canary: verifying host Docker daemon reachability"
            if docker run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock \
                -e DOCKER_HOST=unix:///var/run/docker.sock \
                "$QUARTO_IMAGE" \
                bash -lc 'docker --version && docker info --format "{{.ServerVersion}}" && echo "daemon OK"'; then
              echo "✅ dooD canary passed (host daemon reachable)"
            else
              echo "daemon UNREACHABLE"
              echo "::error::dooD canary FAILED: host Docker daemon unreachable (missing docker CLI in image, or /var/run/docker.sock not mounted)"
              exit 1
            fi
          fi
          # --- v1.3.37-proposal: règle réf -> famille, SOURCE UNIQUE --------------
          # Factorisée ici (appelée par le bloc baseurl deploy-static ET par le bloc
          # directives SEO ci-dessous) pour qu'ils ne puissent pas dériver. Messages
          # et codes de sortie du chemin baseurl IDENTIQUES à la règle v1.3.22.
          sanitize_refname() {
            local slug="${1//\//-}"
            case "$slug" in
              *[!A-Za-z0-9._-]*|"")
                echo "::error::nom de réf non sûr pour un chemin serveur: '$1' (slug '$slug'); seuls [A-Za-z0-9._-] et / sont acceptés" >&2
                return 1 ;;
            esac
            printf '%s' "$slug"
          }
          # Echoe develop | previews/<slug> | releases/<tag> pour les déployables.
          # rc=1: nom de branche non sûr (::error déjà émis sur stderr).
          # rc=2: réf non déployée (tag non-v*, refs/pull/*). rc=3: réf malformée.
          ref_family() {
            local REF="$1" REFNAME SLUG
            case "$REF" in
              refs/heads/*)
                REFNAME="${REF#refs/heads/}"
                if [ "$REFNAME" = "$DEFAULT_BRANCH" ]; then
                  printf 'develop'
                else
                  SLUG="$(sanitize_refname "$REFNAME")" || return 1
                  printf 'previews/%s' "$SLUG"
                fi
                ;;
              refs/tags/v*)
                printf 'releases/%s' "${REF#refs/tags/}"
                ;;
              refs/tags/*|refs/pull/*)
                return 2
                ;;
              *)
                return 3
                ;;
            esac
          }
          # --- DORMANT deploy-static: injection de baseurl ------------------------
          # Quand le wrapper opte (deploy-static=true), on calcule un baseurl ancré
          # sur l'emplacement par dépôt / par branche du serveur personnel et on
          # l'ajoute à la commande de rendu quarto. Quand deploy-static n'est pas
          # "true" (la valeur par défaut), BASEURL_ARG reste vide et la commande
          # quarto est inchangée byte pour byte.
          BASEURL_ARG=""
          if [ "$DEPLOY_STATIC" = "true" ]; then
            if [ -z "$TEACHING_BASE_URL" ]; then
              echo "::error::deploy-static=true mais le secret d'org TEACHING_BASE_URL est vide; impossible de calculer baseurl"
              exit 1
            fi
            # BASEPATH = TEACHING_BASE_URL sans scheme://host (ex. /teaching-material)
            BASEPATH="$(printf '%s' "$TEACHING_BASE_URL" | sed -E 's#^[a-zA-Z][a-zA-Z0-9+.-]*://[^/]+##; s#/$##')"
            # REPO = nom court du dépôt (owner/repo -> repo)
            REPO="$(basename "$GITHUB_REPOSITORY")"
            # SUBPATH depuis GITHUB_REF (règle v1.3.22 — IDENTIQUE à l'étape
            # « Compute target path » du job deploy-static : le REF décide du CHEMIN,
            # jamais de l'éligibilité du job) :
            #   refs/heads/<défaut>  -> develop          (URL develop inchangée)
            #   refs/heads/<branche> -> previews/<slug>  ( / -> - ; [A-Za-z0-9._-] uniquement)
            #   refs/tags/v*         -> releases/<tag>
            #   refs/tags/<non-v*>   -> pas de déploiement -> pas de baseurl (notice)
            #   refs/pull/*          -> pas de déploiement -> pas de baseurl (warning)
            #   autre                -> erreur
            # (Règle v1.3.22 ; la logique est factorisée dans ref_family() ci-dessous,
            #  partagée avec les directives d'indexation SEO — source unique, pas de dérive.)
            # NB: pas de `if ! cmd` ici — `!` écrase $? (toujours 0 dans le then) ;
            # capture explicite via `|| RC=$?` (sain sous bash -e).
            SUBPATH=""
            RC=0
            SUBPATH="$(ref_family "$GITHUB_REF")" || RC=$?
            if [ "$RC" -ne 0 ]; then
              SUBPATH=""
              case "$RC" in
                1) exit 1 ;;
                2)
                  case "$GITHUB_REF" in
                    refs/tags/*)
                      echo "::notice::deploy-static: tag non-v '${GITHUB_REF#refs/tags/}' ignoré — rendu sans baseurl (pas de déploiement, règle v1.3.22)"
                      ;;
                    *)
                      # v1.3.32: un événement pull_request (refs/pull/N/merge|head) est un
                      # contexte NON déployé — le job deploy-static n'exécute déjà que sur
                      # push/delete (if: github.event_name == 'push' || 'delete'). Le `*)`
                      # hérité de la règle v1.3.22 faisait exit 1 sur ces refs, donc ROUGE
                      # systématique (fake red) sur toute l'auto-CI de _quarto-utils et sur
                      # tout wrapper appelant en pull_request (cas documenté: PR #27,
                      # 'refs/pull/27/merge' -> ::error + exit 1 dans le step render).
                      # Même traitement que tag non-v : avis + rendu SANS override baseurl
                      # (SUBPATH vide -> branche « rendu sans override » ci-dessous).
                      echo "::warning::deploy-static=true mais GITHUB_REF '$GITHUB_REF' est un événement pull_request (contexte non déployé) — rendu sans override baseurl"
                      ;;
                  esac
                  ;;
                *)
                  echo "::error::deploy-static=true mais GITHUB_REF '$GITHUB_REF' n'est ni une branche ni un tag; rendu avec baseurl refusé"
                  exit 1
                  ;;
              esac
            fi
            if [ -z "$SUBPATH" ]; then
              # Assouplissement v1.3.22 (décision lead) : refs/tags/<non-v*> ->
              # pas de déploiement -> rendu SANS override baseurl, avec la notice
              # ci-dessus. Le job render N'ÉCHECHE PLUS pour un tag non-v*.
              echo "ℹ️  deploy-static: réf '$GITHUB_REF' non déployée -> rendu sans override baseurl"
            else
              BASEURL="${BASEPATH}/${REPO}/${SUBPATH}/"
              echo "ℹ️  deploy-static: BASEURL=$BASEURL"
              BASEURL_ARG=" --metadata baseurl=$BASEURL"
            fi
          fi
          # --- SEO: directives d'indexation par famille (input seo-directives) ----
          # Même règle ref_family() que le bloc baseurl (source unique, cf. above) :
          #   famille develop   -> website.site-url -> canonical + sitemap.xml Quarto
          #   famille previews  -> <meta name="robots" content="noindex, follow">
          #   releases/tags, pull_request, autres refs -> AUCUNE injection (les
          #   releases gardent la stratégie canonical actuelle, question ouverte
          #   d'indexation v-tag dans la flotte; PR: jamais publié -> rien à marquer).
          # Mécanisme: _quarto.yml.local ("Local Config", couche documentée de
          # Quarto, fusion profonde sur _quarto.yml + profil actif; les listes
          # include-in-header s'APPENDENT, fusion non-remplacement — vérifié sur
          # l'image de rendu de la flotte, Quarto 1.10.18, 2026-10-19). Le flag CLI
          # `--config` n'existe PAS pour `quarto render` de projet en 1.10.18 (il
          # fuit vers pandoc: "Unknown option --config", rendu rouge — même date).
          # Fichier NON TRACKÉ, régénéré par profil dans la boucle ci-dessous et
          # supprimé inconditionnellement ici (workspace self-hosted persistant ->
          # pas de fuite de directives develop -> previews entre runs).
          rm -f "$GITHUB_WORKSPACE/_quarto.yml.local"
          SEO_FAMILY=""
          if [ "${SEO_DIRECTIVES:-true}" = "true" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            SEO_FAMILY="$(ref_family "$GITHUB_REF" 2>/dev/null)" || SEO_FAMILY=""
            case "$SEO_FAMILY" in
              develop)
                if [ -z "$TEACHING_BASE_URL" ]; then
                  echo "::warning::seo-directives=true mais le secret d'org TEACHING_BASE_URL est vide; aucun directive SEO injecté"
                  SEO_FAMILY=""
                fi
                ;;
              previews/*) : ;;
              *) SEO_FAMILY="" ;;
            esac
            if [ -n "$SEO_FAMILY" ]; then
              echo "ℹ️  seo-directives: famille '$SEO_FAMILY' -> _quarto.yml.local généré à chaque profil"
            fi
          fi
          # -----------------------------------------------------------------------
          IFS=',' read -ra PROFILE_LIST <<< "$PROFILES"
          # v1.3.27: merged stdout+stderr of every profile render, tee'd to a
          # workspace file so the "Listing-warn gate" step can inspect it after
          # the loop. (quarto-exec.log from --log is overwritten per profile —
          # this file accumulates across all of them.)
          RENDER_LOG="$GITHUB_WORKSPACE/render-output.log"
          rm -f "$RENDER_LOG"
          # --- v1.3.31-candidate: hang watchdog (input hang-detection-minutes, 0=off) ---
          # Inactivity cap on the render stream: liveness = max mtime of RENDER_LOG and
          # quarto-exec.log; on sustained silence the sidecar dumps forensics, emits a
          # ::error::HANG-DETECTED annotation and docker-kills the render container so
          # `docker run` exits non-zero. The PIPESTATUS branch below stays the SOLE
          # step-status decider (subshell runs `set +e`, every probe `|| true`; the
          # guarded if keeps the main `bash -e` shell inert when the feature is off).
          HANG_MIN="${{ inputs.hang-detection-minutes }}"
          WATCHDOG_PID=""
          if [ -n "$HANG_MIN" ] && [ "$HANG_MIN" != "0" ]; then
            echo ">> Hang watchdog armed: ${HANG_MIN}-min inactivity cap (container: $RENDER_CONTAINER)"
            (
              set +e
              LIMIT=$(( HANG_MIN * 60 ))
              FORENSICS_DIR="$GITHUB_WORKSPACE/hang-forensics"
              mkdir -p "$FORENSICS_DIR"
              DEADLINE=$(( $(date +%s) + LIMIT ))
              while true; do
                sleep 30
                NOW=$(date +%s)
                LOG_MTIME=0
                for f in "$RENDER_LOG" "$GITHUB_WORKSPACE/quarto-exec.log"; do
                  [ -e "$f" ] || continue
                  M=$(stat -c %Y "$f" 2>/dev/null || stat -f %m "$f" 2>/dev/null || echo 0)
                  [ "$M" -gt "$LOG_MTIME" ] && LOG_MTIME=$M
                done
                if [ "$LOG_MTIME" -eq 0 ]; then
                  DEADLINE=$(( NOW + LIMIT ))  # no log yet: keep resetting (pull/startup grace)
                  continue
                fi
                DEADLINE=$(( LOG_MTIME + LIMIT ))
                [ "$NOW" -le "$DEADLINE" ] && continue
                SILENT_MIN=$(( (NOW - LOG_MTIME) / 60 ))
                PAGE=$(sed 's/\x1b\[[0-9;]*m//g' "$RENDER_LOG" 2>/dev/null | grep -oE '\[[0-9]+/[0-9]+\]' | tail -1)
                [ -n "$PAGE" ] || PAGE="unknown"
                echo "::error::HANG-DETECTED after ${SILENT_MIN} min inactivity at page ${PAGE}"
                {  # forensics BEFORE kill
                  echo "=== hang-forensics $(date -Is): ${SILENT_MIN} min silent, page ${PAGE} ==="
                  echo '--- ps -ef (quarto|docker|jupyter) ---'
                  ps -ef | grep -E 'quarto|docker|jupyter' | grep -v grep || true
                  echo '--- docker ps -a (label=ebpro-render=true) ---'
                  docker ps -a --filter label=ebpro-render=true || true
                  echo "--- docker inspect $RENDER_CONTAINER ---"
                  docker inspect --format '{{.State.Status}} started={{.State.StartedAt}} OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}' "$RENDER_CONTAINER" || true
                  echo '--- in-container process list (ps, /proc cmdline fallback) ---'
                  docker exec "$RENDER_CONTAINER" ps -ef 2>/dev/null || docker exec "$RENDER_CONTAINER" sh -c 'for d in /proc/[0-9]*; do printf "%s " "${d#/proc/}"; tr "\0" " " < "$d/cmdline" 2>/dev/null; echo; done' 2>/dev/null || true
                  # v1.3.32: replaced the old 'kernel log tails' probe (/tmp/*kernel*.log,
                  # ~/.local/share/jupyter/log/*), structurally ALWAYS empty: quarto spawns
                  # kernels via /tmp connection files without --log-file, so no kernel log
                  # file ever exists in the render container (proven on 3 live captures).
                  # Observed hang signature is an idle chrome-headless-shell, so capture the
                  # headless-chromium profile dirs and singleton locks instead. 'docker logs'
                  # was evaluated and deliberately SKIPPED as a pure content duplicate of the
                  # tee'd RENDER_LOG (container stdio is double-sunk: client pipe + daemon
                  # json-file; local test 2026-10-17: same lines both sides, interleaving
                  # order only); the 'tail -n 40 $RENDER_LOG' below already covers it.
                  echo '--- chrome profile dirs + singleton locks (in-container) ---'
                  docker exec "$RENDER_CONTAINER" bash -lc 'ls -lad /tmp/.org.chromium.* /tmp/*hrome* 2>/dev/null; find /tmp -maxdepth 2 -name "SingletonLock" -exec ls -la {} \; 2>/dev/null' || true
                  echo "--- tail -n 40 $RENDER_LOG ---"
                  tail -n 40 "$RENDER_LOG" || true
                  echo '--- ls -la _freeze .quarto ---'
                  ls -la "$GITHUB_WORKSPACE/_freeze" "$GITHUB_WORKSPACE/.quarto" || true
                } > "$FORENSICS_DIR/hang-report.txt" 2>&1
                cat "$FORENSICS_DIR/hang-report.txt" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
                docker kill "$RENDER_CONTAINER" >/dev/null 2>&1 || true
                echo "$PAGE" > "$GITHUB_WORKSPACE/.hang-detected" 2>/dev/null || true
                break
              done
            ) &
            WATCHDOG_PID=$!
          fi
          for p in "${PROFILE_LIST[@]}"; do
            echo "Rendering profile: $p"
            # v1.3.37-proposal: régénère la couche locale pour CE profil (rm
            # d'abord: contenu dépend du profil). Le bloc revealjs n'est émis QUE
            # pour les profils slides/revealjs: injecter format.revealjs pendant
            # un rendu notes reproduit la collision double-sortie <slug>.html /
            # safeMoveSync (classe « proven lesson 1 », reproduite live sur
            # l'image de rendu 2026-10-19). Côté develop, website.site-url est
            # toléré par tous les profils (vérifié notes+slides, exit 0).
            rm -f "$GITHUB_WORKSPACE/_quarto.yml.local"
            case "$SEO_FAMILY" in
              develop)
                printf 'website:\n  site-url: "%s/develop/"\nformat:\n  html:\n    canonical-url: true\n' \
                  "${TEACHING_BASE_URL%/}/$(basename "$GITHUB_REPOSITORY")" \
                  > "$GITHUB_WORKSPACE/_quarto.yml.local"
                ;;
              previews/*)
                {
                  printf 'format:\n  html:\n    include-in-header:\n      - text: |\n          <meta name="robots" content="noindex, follow">\n'
                  case "$p" in
                    *slides*|*revealjs*)
                      printf '  revealjs:\n    include-in-header:\n      - text: |\n          <meta name="robots" content="noindex, follow">\n'
                      ;;
                  esac
                } > "$GITHUB_WORKSPACE/_quarto.yml.local"
                ;;
            esac
            # --log: always write quarto's log into the workspace (mounted at
            # /workdir INSIDE the container — $GITHUB_WORKSPACE is a host path
            # that does not exist in the container, so the flag value is the
            # in-container mount point; the file lands at
            # $GITHUB_WORKSPACE/quarto-exec.log on the host and is uploaded by
            # the "Upload quarto execution log" step on failure).
            # RENDER_EXTRA_ARGS: '--execute-debug --log-level debug' on a cold
            # re-run (attempt > 1), empty otherwise (set by the
            # "Cold re-run detection" step).
            # v1.3.32: the ebpro-render=true label makes this container visible to
            # BOTH label consumers below (watchdog forensics 'docker ps -a --filter
            # label=ebpro-render=true' and the EXIT-trap sweep arm). Without it both
            # were dead no-ops (hang-report.txt 2026-10-17: header + zero rows).
            # v1.3.36: added the run-scoped ebpro-render-run label (GITHUB_RUN_ID and
            # GITHUB_RUN_ATTEMPT are runner default env vars, set for every run step;
            # the coarse label is kept for the watchdog forensics reads and human
            # fleet-wide sweeps, while the EXIT-trap sweep arm now matches the
            # run-scoped label only — fixing the cross-run SIGKILL hazard on the
            # shared dooD daemon).
            docker run --rm $DOCKER_MOUNTS --name "$RENDER_CONTAINER" \
              --label "ebpro-render=true" \
              --label "ebpro-render-run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              -v "$GITHUB_WORKSPACE":/workdir \
              -w /workdir \
              "${DOCKER_ARGS[@]}" \
              "$QUARTO_IMAGE" \
              bash -lc "source /home/jovyan/.sdkman/bin/sdkman-init.sh 2>/dev/null || source \$HOME/.sdkman/bin/sdkman-init.sh 2>/dev/null || true; quarto render --profile '$p' --log /workdir/quarto-exec.log${RENDER_EXTRA_ARGS:+ $RENDER_EXTRA_ARGS}$BASEURL_ARG" \
              2>&1 | tee -a "$RENDER_LOG"
            # Scoped pipefail so a non-zero `docker run` still fails the step
            # through the tee pipe (the step shell is bash -e WITHOUT pipefail;
            # setting it step-wide would change unrelated pipeline semantics).
            pipe_status=${PIPESTATUS[0]}
            if [ "$pipe_status" -ne 0 ]; then
              exit "$pipe_status"
            fi
          done
          # v1.3.31-candidate: success path — disarm the watchdog (EXIT trap covers failures).
          if [ -n "${WATCHDOG_PID:-}" ]; then
            kill "$WATCHDOG_PID" 2>/dev/null || true
          fi

      - name: Listing-warn gate
        # v1.3.27: fail the render when Quarto emitted an empty-listing WARN
        # ("The listing in '<file>' using the following contents: ... doesn't
        # match any files or folders."). Such a listing silently yields an
        # empty section — historically the root cause of never-green content.
        # Pattern validated read-only on real runner logs: victim job
        # 116219784910 (run 38672868242, java101: both fragments present) vs
        # healthy job 115966630781 (run 38597126794, se-101: both absent).
        env:
          RENDER_LOG: ${{ github.workspace }}/render-output.log
        run: |
          set -uo pipefail
          # Render succeeded => file exists; still guard for robustness.
          [ -f "$RENDER_LOG" ] || { echo "listing-warn-gate: no render-output.log — skipping"; exit 0; }
          CLEAN="$(mktemp)"
          # Strip ANSI colour escapes so grep anchors match plain text.
          sed 's/\x1b\[[0-9;]*m//g' "$RENDER_LOG" > "$CLEAN"
          if grep -q 'The listing in' "$CLEAN" && grep -q "doesn't match any files" "$CLEAN"; then
            {
              echo "### ❌ listing-warn-gate: empty listing detected"
              echo ""
              echo '```'
              grep -A6 'The listing in' "$CLEAN"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            rm -f "$CLEAN"
            echo "::error::listing-warn-gate: empty listing detected (details in job summary)"
            exit 1
          fi
          rm -f "$CLEAN"
          echo "✅ listing-warn-gate: no empty-listing WARN in render output"

      - name: Export slides PDF (decktape)
        # Runs BEFORE "Package rendered output": PDFs land in <output-path>/pdf/
        # and ride the existing zip (os.walk over the whole output dir) and the
        # deploy-static rsync (whole unpacked site) with zero changes to them.
        # Slides profile output dir: _output/_slides (_quarto-slides.yml
        # `output-dir: _output/_slides`), decks nested by lesson dir as *_L_*.html.
        # Multi-format documents also emit plain Bootstrap *_L_*.html pages in
        # the same tree: each candidate is content-sniffed for the Reveal
        # container (<div class="reveal") before decktape runs; non-decks are
        # skipped (decktape reveal on them only fails "Reveal is not defined").
        #
        # Environment split discovered on canary run #37: this step executes on
        # the RUNNER HOST (bash --noprofile --norc -e -o pipefail), while node/
        # npx and the quarto-baked chromium live INSIDE the solen image that the
        # render step used (/home/jovyan/.local/share/quarto/chromium*). The
        # host-side `ls` of that path therefore hard-failed the step under -e.
        # Fix: run the whole export INSIDE the (locally cached) quarto image when
        # it provides npx, mounting the site output dir; keep a host-side
        # fallback only for images without npx. Diagnostics are never fatal.
        if: inputs.slides-pdf
        continue-on-error: true
        env:
          # Resolved via `npm view decktape version` on 2026-10-13.
          DECKTAPE_VERSION: "3.16.1"
          QUARTO_IMAGE: ${{ inputs.quarto-image }}
          SITE_OUT: ${{ github.workspace }}/${{ inputs.output-path }}
          SLIDES_OUT: ${{ github.workspace }}/${{ inputs.output-path }}/_slides
        run: |
          # Diagnostics must never abort the step: the Actions default shell
          # runs with -e, so disable it explicitly for the probe phase.
          set +e

          echo ">> Host diagnostics (non-fatal):"
          for b in node npm npx python3 docker; do
            printf '   host %-8s -> %s\n' "$b" "$(command -v "$b" 2>/dev/null || echo MISSING)"
          done
          echo "   host chromium probes:"
          command -v chromium chromium-browser google-chrome 2>/dev/null
          ls "$HOME/.local/share/quarto" 2>/dev/null || true
          ls /home/jovyan/.local/share/quarto 2>/dev/null || true
          echo "   cached solen images on this runner:"
          docker images 2>/dev/null | grep -i solen || true

          if [ ! -d "$SLIDES_OUT" ]; then
            echo "::warning::Slides output dir not found: $SLIDES_OUT (slides profile did not render?); skipping decktape export"
            exit 0
          fi

          # Probe the render image itself for node/npx (it is locally cached from
          # the render step; no pull should be needed). Login-shell probe so
          # PATH contributions from /etc/profile or nvm-style rc files count.
          echo ">> Probing $QUARTO_IMAGE for node/npx:"
          IMAGE_HAS_NPX=0
          if docker run --rm "$QUARTO_IMAGE" bash -lc 'command -v npx && command -v node'; then
            IMAGE_HAS_NPX=1
            echo ">> npx available inside the quarto image -> exporting decks in-container"
          else
            echo ">> npx NOT available inside the quarto image -> host fallback path"
          fi

          if [ "$IMAGE_HAS_NPX" = "1" ]; then
            # --- Container path -------------------------------------------------
            # The export script runs inside the quarto image with the site output
            # dir mounted at /site. The image provides npx AND the quarto-baked
            # chromium under /home/jovyan/.local/share/quarto/chromium*/. PDFs
            # are written to /site/pdf/<rel>.pdf (= $SITE_OUT/pdf/), which rides
            # the existing zip artifact and rsync unchanged.
            # IMPORTANT (run #38 lesson): the runner is itself a container that
            # talks to the host Docker daemon (dooD). Host-side bind sources must
            # exist at the SAME absolute path on the host, so /tmp files are NOT
            # shareable (Docker silently created an empty dir as the mount source
            # -> "Is a directory", exit 126). $GITHUB_WORKSPACE is a shared path
            # (proven by the render step's -v "$GITHUB_WORKSPACE":/workdir). Put
            # the script at the workspace root — OUTSIDE $SITE_OUT, so it never
            # rides the zip artifact or the rsync — and remove it after the run.
            EXPORT_SCRIPT="${GITHUB_WORKSPACE:-$SITE_OUT/..}/.decktape-export.sh"
            # NOTE: heredoc body and terminator sit at column 0 of the generated
            # script (YAML block-scalar base indent) so bash terminates it.
            cat > "$EXPORT_SCRIPT" <<'DECKTAPE_EXPORT_EOF'
          #!/usr/bin/env bash
          set -uo pipefail

          echo ">> Container diagnostics (non-fatal):"
          for b in node npm npx python3; do
            printf '   image %-8s -> %s\n' "$b" "$(command -v "$b" 2>/dev/null || echo MISSING)"
          done

          cd /site/_slides || exit 1
          shopt -s globstar nullglob
          decks=(**/*_L_*.html)
          if [ "${#decks[@]}" -eq 0 ]; then
            echo "::warning::No *_L_*.html decks found under /site/_slides; nothing to export"
            exit 0
          fi

          # Chromium discovery: quarto-baked chromium first (guaranteed inside
          # the image), then PATH browsers.
          CHROME=""
          for base in /home/jovyan /root "$HOME"; do
            for candidate in "$base"/.local/share/quarto/chromium*/chrome-linux*/chrome; do
              if [ -x "$candidate" ]; then CHROME="$candidate"; break 2; fi
            done
          done
          if [ -z "$CHROME" ]; then
            CHROME="$(command -v chromium chromium-browser google-chrome 2>/dev/null | head -n1)"
          fi
          if [ -z "$CHROME" ]; then
            echo "::error::No chromium found inside the quarto image (checked /home/jovyan, /root, \$HOME under .local/share/quarto/chromium*/ and PATH)"
            exit 1
          fi
          echo ">> Using container chrome: $CHROME"

          # Serve the slides tree locally inside the container network namespace.
          if command -v python3 >/dev/null 2>&1; then
            python3 -m http.server 8080 --directory /site/_slides >/dev/null 2>&1 &
          elif command -v npx >/dev/null 2>&1; then
            npx -y http-server -p 8080 /site/_slides >/dev/null 2>&1 &
          else
            echo "::error::Neither python3 nor npx available inside the container to serve the slides output"
            exit 1
          fi
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          if command -v curl >/dev/null 2>&1; then
            ready=0
            for _ in $(seq 1 20); do
              if curl -sf -o /dev/null "http://127.0.0.1:8080/"; then ready=1; break; fi
              sleep 0.5
            done
            if [ "$ready" -ne 1 ]; then echo "::error::In-container static server did not come up on 8080"; exit 1; fi
          else
            sleep 3
          fi

          echo ">> Exporting ${#decks[@]} deck(s) to /site/pdf/ (in-container)"
          failures=0
          for deck in "${decks[@]}"; do
            rel="${deck#./}"
            # Reveal content sniff: skip *_L_*.html pages that are not decks.
            if ! grep -qF '<div class="reveal"' "$deck"; then
              echo ">> skipping $rel (not a revealjs deck)"
              continue
            fi
            url_rel=$(printf '%s' "$rel" | sed 's/ /%20/g')
            out="/site/pdf/${rel%.html}.pdf"
            mkdir -p "$(dirname "$out")"
            echo ">> decktape: $rel -> pdf/${rel%.html}.pdf"
            if ! npx -y "decktape@${DECKTAPE_VERSION}" reveal \
                --chrome-path "$CHROME" \
                --chrome-arg=--no-sandbox \
                --chrome-arg=--disable-gpu \
                --pause 3000 \
                "http://127.0.0.1:8080/${url_rel}" "$out"; then
              echo "::warning::decktape failed for $rel (continuing; step is warn-only)"
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "::warning::$failures/${#decks[@]} deck(s) failed to export (container path)"
          else
            echo "✅ All ${#decks[@]} deck(s) exported under /pdf/ of the site output (container path)"
          fi
          DECKTAPE_EXPORT_EOF

            # Login shell (-l) so the image's node PATH setup applies to the
            # script too; DECKTAPE_VERSION forwarded via -e.
            docker run --rm \
              -v "$SITE_OUT:/site:Z" \
              -v "$EXPORT_SCRIPT:/tmp/decktape-export.sh:ro" \
              -w /site \
              -e DECKTAPE_VERSION \
              "$QUARTO_IMAGE" \
              bash -l /tmp/decktape-export.sh
            rc=$?
            rm -f "$EXPORT_SCRIPT"
            exit $rc
          fi

          # --- Host fallback (image lacks npx) ----------------------------------
          # Chromium discovery: quarto-managed chromium first, then PATH browsers.
          CHROME=""
          for candidate in /home/jovyan/.local/share/quarto/chromium*/chrome-linux*/chrome; do
            if [ -x "$candidate" ]; then CHROME="$candidate"; break; fi
          done
          if [ -z "$CHROME" ]; then
            CHROME=$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)
          fi
          if [ -z "$CHROME" ]; then
            echo "::error::Host fallback: no chromium found on the runner host (checked /home/jovyan/.local/share/quarto/chromium*/ and PATH for chromium/chromium-browser/google-chrome); cannot run decktape"
            exit 1
          fi
          echo ">> Host fallback chrome: $CHROME"

          if ! command -v npx >/dev/null 2>&1; then
            echo "::error::Host fallback: neither the quarto image nor the runner host provides npx; cannot run decktape"
            exit 1
          fi

          # Serve the slides output tree locally (python3 preferred).
          SERVER_PID=""
          if command -v python3 >/dev/null 2>&1; then
            python3 -m http.server 8080 --directory "$SLIDES_OUT" >/dev/null 2>&1 &
            SERVER_PID=$!
          else
            npx -y http-server -p 8080 "$SLIDES_OUT" >/dev/null 2>&1 &
            SERVER_PID=$!
          fi
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          # Wait for the server to accept connections (max ~10s; fixed sleep if curl absent).
          if command -v curl >/dev/null 2>&1; then
            ready=0
            for _ in $(seq 1 20); do
              if curl -sf -o /dev/null "http://127.0.0.1:8080/"; then ready=1; break; fi
              sleep 0.5
            done
            if [ "$ready" -ne 1 ]; then echo "::error::Local static server did not come up on 8080"; exit 1; fi
          else
            sleep 3
          fi

          # Loop over every deck, preserving its relative path under pdf/.
          cd "$SLIDES_OUT"
          shopt -s globstar nullglob
          decks=(**/*_L_*.html)
          if [ "${#decks[@]}" -eq 0 ]; then
            echo "::warning::No *_L_*.html decks found under $SLIDES_OUT; nothing to export"
            exit 0
          fi
          echo ">> Exporting ${#decks[@]} deck(s) to $SITE_OUT/pdf/ (host fallback)"
          failures=0
          for deck in "${decks[@]}"; do
            rel="${deck#./}"
            # Reveal content sniff: skip *_L_*.html pages that are not decks.
            if ! grep -qF '<div class="reveal"' "$deck"; then
              echo ">> skipping $rel (not a revealjs deck)"
              continue
            fi
            url_rel=$(printf '%s' "$rel" | sed 's/ /%20/g')
            out="$SITE_OUT/pdf/${rel%.html}.pdf"
            mkdir -p "$(dirname "$out")"
            echo ">> decktape: $rel -> ${out#"$SITE_OUT"/}"
            if ! npx -y "decktape@${DECKTAPE_VERSION}" reveal \
                --chrome-path "$CHROME" \
                --chrome-arg=--no-sandbox \
                --chrome-arg=--disable-gpu \
                --pause 3000 \
                "http://127.0.0.1:8080/${url_rel}" "$out"; then
              echo "::warning::decktape failed for $rel (continuing; step is warn-only)"
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "::warning::$failures/${#decks[@]} deck(s) failed to export (host fallback)"
          else
            echo "✅ All ${#decks[@]} deck(s) exported under /pdf/ of the site output (host fallback)"
          fi

      - name: Package rendered output
        run: |
          OUT_DIR="${{ github.workspace }}/${{ inputs.output-path }}"
          if [ ! -d "$OUT_DIR" ]; then
            echo "::error::Output dir not found: $OUT_DIR — render produced nothing; refusing to deploy an empty site"
            exit 1
          fi
          FILE_COUNT=$(find "$OUT_DIR" -type f | wc -l)
          echo "Packaging $FILE_COUNT files from $OUT_DIR"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::Output dir is empty: $OUT_DIR — refusing to deploy an empty site"
            exit 1
          fi
          cd "$OUT_DIR"
          python3 -c "
          import zipfile, os
          zf = zipfile.ZipFile('${{ github.workspace }}/site-zip.zip', 'w', zipfile.ZIP_DEFLATED)
          for root, dirs, files in os.walk('.'):
              for f in files:
                  p = os.path.join(root, f)
                  zf.write(p)
          zf.close()
          print(f'Created zip: {os.path.getsize(\"${{ github.workspace }}/site-zip.zip\")} bytes')
          "

      - name: Guard staging path
        # Staging handoff (Model B) — emitter-side path guard. Validates EVERY
        # path segment BEFORE any step interpolates it into a remote path.
        # Downstream staging steps MUST consume steps.guard.outputs.* (the
        # validated values) — never a raw input/env. Prefix `teaching-staging`
        # is LITERAL; the dir stays relative to the deploy user's home
        # (no /home/... hardcoded here).
        id: guard
        if: github.event_name == 'push' && inputs.site-transport != 'artifact'
        env:
          SITE_TRANSPORT: ${{ inputs.site-transport }}
        run: |
          set -euo pipefail
          case "$SITE_TRANSPORT" in
            artifact|staging|both) ;;
            *)
              echo "::error::Invalid site-transport '$SITE_TRANSPORT' — expected one of: artifact | staging | both (no fallback)"
              exit 1
              ;;
          esac
          validate_segment() {
            local name="$1" seg="$2"
            if [[ "$seg" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,99}$ ]] \
               && [[ "$seg" != "." && "$seg" != ".." ]] \
               && [[ "$seg" != .* && "$seg" != -* ]]; then
              return 0
            fi
            echo "::error::Invalid staging path segment $name='$seg' — must match ^[A-Za-z0-9_][A-Za-z0-9._-]{0,99}\$ (cap 100, no leading . or -), must not be '.' or '..'"
            return 1
          }
          REPO="$(basename "$GITHUB_REPOSITORY")"
          RUN_ID="$GITHUB_RUN_ID"
          ATTEMPT="$GITHUB_RUN_ATTEMPT"
          validate_segment REPO "$REPO"
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::GITHUB_RUN_ID is not numeric: '$RUN_ID'"; exit 1; }
          [[ "$ATTEMPT" =~ ^[0-9]+$ ]] || { echo "::error::GITHUB_RUN_ATTEMPT is not numeric: '$ATTEMPT'"; exit 1; }
          RUN_DIR="$RUN_ID-$ATTEMPT"
          validate_segment RUN_DIR "$RUN_DIR"
          STAGING_DIR="teaching-staging/$REPO/$RUN_DIR"
          {
            echo "repo=$REPO"
            echo "run-dir=$RUN_DIR"
            echo "staging-dir=$STAGING_DIR"
          } >> "$GITHUB_OUTPUT"
          echo "✅ staging path validated — target (relative to deploy home): $STAGING_DIR"

      - name: Staging key material
        # Mirrors the deploy job's "Write SSH key" pattern (mktemp + printf + chmod 600,
        # secret only via env, never echoed). Key path exported as an OUTPUT so the
        # mid-block staging steps and the cleanup step resolve the SAME file; the key
        # window is closed by "Clean up staging key" (if: always()) below — Turn C will
        # insert Ensure dir / Push / Verify digest / Export outputs between them.
        id: staging-key
        if: github.event_name == 'push' && inputs.site-transport != 'artifact'
        env:
          TEACHING_DEPLOY_SSH_KEY: ${{ secrets.TEACHING_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$TEACHING_DEPLOY_SSH_KEY" ]; then
            echo "::error::Le secret TEACHING_DEPLOY_SSH_KEY n'est pas défini ou n'est pas visible par ce dépôt ; staging impossible"
            exit 1
          fi
          KEY="$(mktemp /tmp/teaching-staging-key.XXXXXX)"
          printf '%s\n' "$TEACHING_DEPLOY_SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          echo "key-path=$KEY" >> "$GITHUB_OUTPUT"

      - name: Ensure staging dir
        # Receiver-side mirror of the guard: steps.guard.outputs.staging-dir is
        # RE-VALIDATED per segment before ANY use (never a raw output). The
        # remote command is DOUBLE-QUOTED with LOCAL expansion of the validated
        # path + escaped inner quotes — never single-quoted (that would leak
        # $vars to the remote shell, spec P2-8). Prefix `teaching-staging`
        # literal, home-relative (no /home/... here). Failure => red.
        if: github.event_name == 'push' && inputs.site-transport != 'artifact'
        env:
          KEY: ${{ steps.staging-key.outputs.key-path }}
          STAGING_DIR: ${{ steps.guard.outputs.staging-dir }}
        run: |
          set -euo pipefail
          require_staging_dir() {
            local d="$1" rest seg
            if [[ ! "$d" =~ ^teaching-staging/[^/]+/[^/]+$ ]]; then
              echo "::error::staging-dir malformed (expected exactly teaching-staging/<repo>/<run>-<attempt>): '$d'"
              return 1
            fi
            rest="${d#teaching-staging/}"
            for seg in "${rest%%/*}" "${rest#*/}"; do
              if [[ "$seg" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,99}$ ]] \
                 && [[ "$seg" != "." && "$seg" != ".." ]] \
                 && [[ "$seg" != .* && "$seg" != -* ]]; then
                continue
              fi
              echo "::error::Invalid staging path segment '$seg' — guard mirror: ^[A-Za-z0-9_][A-Za-z0-9._-]{0,99}\$, not '.' or '..', no leading '.' or '-'"
              return 1
            done
          }
          require_staging_dir "$STAGING_DIR"
          ssh -i "$KEY" -o StrictHostKeyChecking=accept-new "bruno@vai.univ-tln.fr" "mkdir -p \"$STAGING_DIR\""
          echo "✅ staging dir ready: $STAGING_DIR"

      - name: Push site to staging
        if: github.event_name == 'push' && inputs.site-transport != 'artifact'
        env:
          KEY: ${{ steps.staging-key.outputs.key-path }}
          STAGING_DIR: ${{ steps.guard.outputs.staging-dir }}
        run: |
          set -euo pipefail
          require_staging_dir() {
            local d="$1" rest seg
            if [[ ! "$d" =~ ^teaching-staging/[^/]+/[^/]+$ ]]; then
              echo "::error::staging-dir malformed (expected exactly teaching-staging/<repo>/<run>-<attempt>): '$d'"
              return 1
            fi
            rest="${d#teaching-staging/}"
            for seg in "${rest%%/*}" "${rest#*/}"; do
              if [[ "$seg" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,99}$ ]] \
                 && [[ "$seg" != "." && "$seg" != ".." ]] \
                 && [[ "$seg" != .* && "$seg" != -* ]]; then
                continue
              fi
              echo "::error::Invalid staging path segment '$seg' — guard mirror: ^[A-Za-z0-9_][A-Za-z0-9._-]{0,99}\$, not '.' or '..', no leading '.' or '-'"
              return 1
            done
          }
          require_staging_dir "$STAGING_DIR"
          LOCAL_ZIP="$GITHUB_WORKSPACE/site-zip.zip"
          if [ ! -f "$LOCAL_ZIP" ]; then
            echo "::error::Local site-zip not found: $LOCAL_ZIP — Package rendered output must produce it before the staging push"
            exit 1
          fi
          # Transport: rsync primary, scp fallback — the render container is NOT
          # guaranteed rsync (same posture as the deploy job's "Ensure rsync"
          # step); openssh scp is present wherever the ssh key works. A FAILING
          # transport stays red (set -e): the fallback covers tool ABSENCE only,
          # never a failed transfer (no silent artifact-only degradation here).
          if command -v rsync >/dev/null 2>&1; then
            rsync -az -e "ssh -i $KEY -o StrictHostKeyChecking=accept-new" "$LOCAL_ZIP" "bruno@vai.univ-tln.fr:$STAGING_DIR/site.zip"
          else
            echo "::notice::rsync absent from the render container — scp fallback (same validated destination)"
            scp -i "$KEY" -o StrictHostKeyChecking=accept-new "$LOCAL_ZIP" "bruno@vai.univ-tln.fr:$STAGING_DIR/site.zip"
          fi
          echo "✅ site.zip pushed to staging: $STAGING_DIR/site.zip"

      - name: Verify remote digest
        # Attestation: the zip that landed on vai must be byte-identical to the
        # locally packaged one. Mismatch => RED, NO fallback (a divergent
        # staging payload is a poisoning suspicion, not a soft condition). The
        # always() key cleanup below still runs on the failure.
        id: staging-verify
        if: github.event_name == 'push' && inputs.site-transport != 'artifact'
        env:
          KEY: ${{ steps.staging-key.outputs.key-path }}
          STAGING_DIR: ${{ steps.guard.outputs.staging-dir }}
        run: |
          set -euo pipefail
          require_staging_dir() {
            local d="$1" rest seg
            if [[ ! "$d" =~ ^teaching-staging/[^/]+/[^/]+$ ]]; then
              echo "::error::staging-dir malformed (expected exactly teaching-staging/<repo>/<run>-<attempt>): '$d'"
              return 1
            fi
            rest="${d#teaching-staging/}"
            for seg in "${rest%%/*}" "${rest#*/}"; do
              if [[ "$seg" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,99}$ ]] \
                 && [[ "$seg" != "." && "$seg" != ".." ]] \
                 && [[ "$seg" != .* && "$seg" != -* ]]; then
                continue
              fi
              echo "::error::Invalid staging path segment '$seg' — guard mirror: ^[A-Za-z0-9_][A-Za-z0-9._-]{0,99}\$, not '.' or '..', no leading '.' or '-'"
              return 1
            done
          }
          require_staging_dir "$STAGING_DIR"
          LOCAL_ZIP="$GITHUB_WORKSPACE/site-zip.zip"
          LOCAL_SHA="$(sha256sum "$LOCAL_ZIP" | awk '{print $1}')"
          if [[ ! "$LOCAL_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Local digest malformed (expected 64 hex): '$LOCAL_SHA'"
            exit 1
          fi
          REMOTE_SHA="$(ssh -i "$KEY" -o StrictHostKeyChecking=accept-new "bruno@vai.univ-tln.fr" "sha256sum \"$STAGING_DIR/site.zip\"" | awk '{print $1}')"
          if [[ ! "$REMOTE_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Remote digest unreadable or malformed (expected 64 hex): '$REMOTE_SHA' — cannot attest the staging upload"
            exit 1
          fi
          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "::error::digest mismatch staging — suspicion d'empoisonnement: local=$LOCAL_SHA remote=$REMOTE_SHA (dir=$STAGING_DIR). Rouge sans fallback."
            exit 1
          fi
          echo "sha256=$LOCAL_SHA" >> "$GITHUB_OUTPUT"
          echo "✅ remote staging digest attested: $LOCAL_SHA"

      - name: Export staging outputs
        # Consumes ONLY re-validated values (guard output + attested digest).
        # staging-zip is redundancy for humans/forensics; the deploy side must
        # re-derive the remote path from staging-dir (never interpolate this).
        id: staging-export
        if: github.event_name == 'push' && inputs.site-transport != 'artifact'
        env:
          STAGING_DIR: ${{ steps.guard.outputs.staging-dir }}
          SHA256: ${{ steps.staging-verify.outputs.sha256 }}
        run: |
          set -euo pipefail
          require_staging_dir() {
            local d="$1" rest seg
            if [[ ! "$d" =~ ^teaching-staging/[^/]+/[^/]+$ ]]; then
              echo "::error::staging-dir malformed (expected exactly teaching-staging/<repo>/<run>-<attempt>): '$d'"
              return 1
            fi
            rest="${d#teaching-staging/}"
            for seg in "${rest%%/*}" "${rest#*/}"; do
              if [[ "$seg" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,99}$ ]] \
                 && [[ "$seg" != "." && "$seg" != ".." ]] \
                 && [[ "$seg" != .* && "$seg" != -* ]]; then
                continue
              fi
              echo "::error::Invalid staging path segment '$seg' — guard mirror: ^[A-Za-z0-9_][A-Za-z0-9._-]{0,99}\$, not '.' or '..', no leading '.' or '-'"
              return 1
            done
          }
          require_staging_dir "$STAGING_DIR"
          if [[ ! "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::staging sha256 missing or malformed — refusing to advertise a non-attested upload"
            exit 1
          fi
          {
            echo "staging-dir=$STAGING_DIR"
            echo "staging-zip=$STAGING_DIR/site.zip"
            echo "staging-sha256=$SHA256"
            echo "staging-ready=true"
          } >> "$GITHUB_OUTPUT"
          echo "✅ staging outputs exported (staging-ready=true, digest attested)"

      - name: Clean up staging key
        # always() is CRITICAL (spec §1.1-7 / P1-3): the private key must be removed
        # from the persistent self-hosted runner EVEN WHEN the push/verify steps of
        # the staging window fail — a digest mismatch turns the job red precisely at
        # the moment the key exists on disk; without always() it would reside there.
        if: always() && github.event_name == 'push' && inputs.site-transport != 'artifact'
        env:
          KEY: ${{ steps.staging-key.outputs.key-path }}
        run: |
          if [ -n "${KEY:-}" ]; then
            rm -f "$KEY"
          fi

      - name: Publish debug bundle
        # Server-side forensics channel (runs on success AND failure, push AND PR).
        # Rationale: the Actions artifact pool is 2 GiB ORG-WIDE on the Team plan and
        # the meter lags 6–12 h after purges — a quota-red upload silently kills the
        # exec-log forensics precisely when they matter. The exec log + hang forensics
        # therefore now ALSO ride the proven server transport (user-provisioned
        # /home/perso/bruno/teaching-ci-debug, home-relative like teaching-staging).
        # Auth posture copied from deploy-static "Write SSH key" + staging steps:
        # secret only via env, mktemp + chmod 600 (step-scoped, EXIT-trap removed),
        # literal host bruno@vai.univ-tln.fr, StrictHostKeyChecking=accept-new,
        # rsync -az --mkpath primary / scp fallback on tool absence only.
        # Contents: $GITHUB_WORKSPACE/quarto-exec.log (the quarto --log file the
        # "Upload quarto execution log" step ships, produced by the render step's
        # `quarto render --log /workdir/quarto-exec.log`) + $GITHUB_WORKSPACE/
        # hang-forensics/ (the watchdog FORENSICS_DIR) when present.
        # Layout: teaching-ci-debug/<repo>/<run_id>-<run_attempt>/ ; a 14-day
        # retention sweep over this repo's run dirs follows every successful push.
        # STRICTLY BEST-EFFORT: continue-on-error + every failure branch emits
        # ::warning:: and exits 0 — this step must never fail the render job.
        # Secret availability is guarded IN-SCRIPT via env (empty key => notice +
        # exit 0): the `secrets` context is not allowed in a reusable workflow's
        # step-level `if:` (actionlint context-availability rule).
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          TEACHING_DEPLOY_SSH_KEY: ${{ secrets.TEACHING_DEPLOY_SSH_KEY }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -uo pipefail
          HOST="bruno@vai.univ-tln.fr"
          LOG="$GITHUB_WORKSPACE/quarto-exec.log"
          FOR_DIR="$GITHUB_WORKSPACE/hang-forensics"
          # Gate: publish only when there is actually something to publish.
          if [ ! -f "$LOG" ] && [ ! -d "$FOR_DIR" ]; then
            echo ">> debug bundle: neither quarto-exec.log nor hang-forensics/ present — nothing to publish"
            exit 0
          fi
          if [ -z "${TEACHING_DEPLOY_SSH_KEY:-}" ]; then
            echo ">> debug bundle: TEACHING_DEPLOY_SSH_KEY not visible for this repo — skipping (artifact upload is the fallback)"
            exit 0
          fi
          # Path-segment validation (mirrors "Guard staging path"); fail-CLOSED on the
          # remote path but fail-SOFT on the job: warn + skip, never red.
          if [[ ! "$REPO" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,99}$ ]] || [[ "$REPO" == "." || "$REPO" == ".." ]]; then
            echo "::warning::debug bundle: invalid repo path segment '$REPO' — skipping server publish"
            exit 0
          fi
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]] || [[ ! "$ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo "::warning::debug bundle: non-numeric run id/attempt ($RUN_ID-$ATTEMPT) — skipping server publish"
            exit 0
          fi
          DEST="teaching-ci-debug/$REPO/$RUN_ID-$ATTEMPT"
          KEY="$(mktemp /tmp/teaching-debug-key.XXXXXX)"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$TEACHING_DEPLOY_SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          if ! ssh -i "$KEY" -o StrictHostKeyChecking=accept-new "$HOST" "mkdir -p -- '$DEST'"; then
            echo "::warning::debug bundle: remote mkdir failed for $DEST — skipping (render verdict unchanged)"
            exit 0
          fi
          SRC=()
          [ -f "$LOG" ] && SRC+=("$LOG")
          [ -d "$FOR_DIR" ] && SRC+=("$FOR_DIR/")
          RC=1
          if command -v rsync >/dev/null 2>&1; then
            # Same flag family as deploy-static's rsync step (-az --mkpath); no
            # --delete: the debug tree is append-only forensics.
            rsync -az --mkpath -e "ssh -i $KEY -o StrictHostKeyChecking=accept-new" "${SRC[@]}" "$HOST:$DEST/" && RC=0
          else
            echo "::notice::rsync absent — scp fallback (same validated destination)"
            OK=1
            for s in "${SRC[@]}"; do
              scp -r -i "$KEY" -o StrictHostKeyChecking=accept-new "$s" "$HOST:$DEST/" || OK=0
            done
            [ "$OK" = 1 ] && RC=0
          fi
          if [ "$RC" != 0 ]; then
            echo "::warning::debug bundle: transfer to $HOST:$DEST/ failed — non-fatal (artifact uploads below untouched)"
            exit 0
          fi
          echo "✅ debug bundle published: $HOST:~/$DEST/"
          # 14-day retention sweep: this repo's run dirs only, home-relative,
          # -mtime +14 on the immutable <run>-<attempt> dirs (mtime == publish time).
          if ssh -i "$KEY" -o StrictHostKeyChecking=accept-new "$HOST" "find 'teaching-ci-debug/$REPO' -maxdepth 1 -mindepth 1 -mtime +14 -exec rm -rf {} +"; then
            echo ">> retention sweep done (bundles older than 14 days under $REPO removed)"
          else
            echo "::warning::debug bundle: retention sweep failed for $REPO — non-fatal (bundle itself is published)"
          fi

      - name: Upload site artifact
        # v1.3.35 (quota): site-zip is a deploy-transient payload — the fleet
        # publishes to the rsync target, not to GitHub. 1-day retention floor
        # (was 7): if the post-deploy purge in deploy-static is skipped (PR run,
        # deploy failure/skip) or its API call fails, the floor still reclaims
        # the Team-plan 2 GiB artifact pool within a day. NOTE: the `expires`
        # input does NOT exist in actions/upload-artifact v4-v7 (verified
        # against upstream action.yml 2026-10-18) — retention-days is the
        # supported mechanism for the same 1-day floor.
        # Output artifact-id feeds the post-deploy purge (render job output
        # site-artifact-id).
        # Staging handoff (Model B): staging-pure SKIPS the site-zip upload
        # entirely (quota-immune channel); both dual-writes. The upload is still
        # ATTEMPTED first in artifact/both mode (transport stays fully
        # functional); only its FAILURE is now non-fatal for every transport
        # (continue-on-error: true): the pool is 2 GiB ORG-WIDE and the billing
        # meter lags 6–12 h, so a quota-red upload is infra weather — it must
        # never kill an otherwise-green render (silent kill switch). Forensics no
        # longer depend on artifact availability ("Publish debug bundle" above
        # mirrors them to the server). id + the artifact-id output are preserved;
        # the post-deploy purge self-skips on an empty id (its if: guards
        # site-artifact-id != '').
        id: upload-site
        if: inputs.site-transport != 'staging'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: site-zip
          path: site-zip.zip
          retention-days: 1

      - name: Upload quarto execution log
        # Design rule 6: the quarto --log file is uploaded whenever the run
        # fails (render, packaging, or any later hard failure). Placed after
        # the site upload so a successful render also reaches this step while
        # the job is still green (no-op there); if-no-files-found guards the
        # early-failure case where quarto never started.
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: quarto-exec-log
          # v1.3.31-candidate: hang-forensics/ rides along when present (ignore semantics).
          path: |
            quarto-exec.log
            hang-forensics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Freeze cache size gate
        id: freeze-size
        if: inputs.freeze == true
        # Save policy (design rule 7): never push a bloated payload into the
        # org-wide cache pool. du -sb = apparent bytes of the two cached
        # dirs; cap = 900 MiB (900*1024*1024). Breach -> save step is skipped
        # and a warning lands in the step summary.
        run: |
          set -uo pipefail
          # v1.3.28 (hotfix): du exits 1 when either cache dir is absent; under
          # pipefail that failed status propagated through the command
          # substitution and the step's default `bash -e` aborted the step
          # BEFORE the BYTES=0 warning+skip branch (18 fleet runs died here
          # post-upload with freeze=false). `|| true` inside the substitution
          # keeps awk's sum (0 on total miss, real size on partial miss) and
          # makes the empty-payload branch reachable again.
          BYTES="$(du -sb "$GITHUB_WORKSPACE/_freeze" "$GITHUB_WORKSPACE/.quarto" 2>/dev/null | awk '{s+=$1} END{print s+0}' || true)"
          CAP=$((900 * 1024 * 1024))
          MB=$((BYTES / 1024 / 1024))
          # v1.3.27 (cosmetic): sub-MiB payloads printed as "0 MiB" — show bytes instead.
          if [ "$BYTES" -lt 1048576 ]; then HUMAN="${BYTES} bytes"; else HUMAN="${MB} MiB"; fi
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          if [ "$BYTES" -gt 0 ] && [ "$BYTES" -lt "$CAP" ]; then
            echo "under_cap=true" >> "$GITHUB_OUTPUT"
            echo "✅ freeze cache payload ${HUMAN} (>0, < 900 MiB cap) — save allowed"
          else
            echo "under_cap=false" >> "$GITHUB_OUTPUT"
            if [ "$BYTES" -eq 0 ]; then
              echo "::warning::freeze cache payload is empty (no _freeze/.quarto content) — skipping cache save"
            else
              echo "::warning::freeze cache payload ${HUMAN} >= 900 MiB cap — skipping cache save"
            fi
            {
              echo "### ⚠️ Freeze cache save skipped"
              echo ""
              echo "Cache payload (\`du -sb _freeze .quarto\`) is ${HUMAN} — outside the (0, 900 MiB) save window; nothing saved."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Freeze cache save
        # Explicit success condition (replaces the old canary `if: always()`).
        # Save only when ALL hold: job green; push to the caller's default
        # branch; the freeze mechanism is on; the restore did NOT hit the
        # exact key (cache-hit != 'true' — a green exact-hit run has nothing
        # new to store, and re-saving the same key would collide); payload
        # inside the size window. A re-run (restore skipped) has an empty
        # cache-hit output and therefore may save; a collide-with-existing-key
        # save fails harmlessly under continue-on-error.
        if: >-
          success() &&
          inputs.freeze == true &&
          github.event_name == 'push' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          steps.cache-restore.outputs.cache-hit != 'true' &&
          steps.freeze-size.outputs.under_cap == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/_freeze
            ${{ github.workspace }}/.quarto
          key: qfreeze-v1-${{ runner.os }}-${{ steps.freeze-key.outputs.digest }}-${{ steps.freeze-key.outputs.qver }}-${{ steps.freeze-key.outputs.snap }}

  deploy-static:
    needs: render
    # Gate (v1.3.22): opt-in input + push/delete event. Le REF ne décide plus de
    # l'éligibilité du job — il décide du CHEMIN DESTINATION dans l'étape
    # « Compute target path » : branche par défaut -> develop/ ; autres branches
    # -> previews/<slug>/ ; tags v* -> releases/<tag>/ (+ pointeur stable/) ;
    # tags non-v* -> skip ; suppression de branche -> rm previews/<slug>/ uniquement.
    # Les runs PR restent exclus côté wrapper (deploy-static: ${{ github.event_name
    # != 'pull_request' }}) — jamais un PR ne reçoit deploy-static=true.
    if: inputs.deploy-static && (github.event_name == 'push' || github.event_name == 'delete')
    timeout-minutes: 15
    runs-on: [self-hosted, linux, ebpro-org, x64]
    permissions:
      # v1.3.35: actions: write is required by the post-deploy artifact purge
      # (DELETE /repos/.../actions/artifacts/{id}). Same grant the render job
      # already declares (fleet-proven at caller default), no other scope.
      actions: write
    steps:
      - name: Ensure rsync is available
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if command -v rsync >/dev/null 2>&1; then
            echo "rsync already present: $(rsync --version | head -n1)"; exit 0
          fi
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          if command -v apt-get >/dev/null 2>&1; then
            $SUDO apt-get update -y && $SUDO apt-get install -y rsync
          elif command -v apk >/dev/null 2>&1; then
            $SUDO apk add --no-cache rsync
          elif command -v dnf >/dev/null 2>&1; then
            $SUDO dnf install -y rsync
          elif command -v yum >/dev/null 2>&1; then
            $SUDO yum install -y rsync
          else
            echo "::error::rsync missing and no supported package manager (apt-get/apk/dnf/yum) found"
            exit 1
          fi
          echo "Installed: $(rsync --version | head -n1)"

      - name: Write SSH key
        env:
          TEACHING_DEPLOY_SSH_KEY: ${{ secrets.TEACHING_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$TEACHING_DEPLOY_SSH_KEY" ]; then
            echo "::error::Le secret TEACHING_DEPLOY_SSH_KEY n'est pas défini ou n'est pas visible par ce dépôt ; déploiement impossible"
            exit 1
          fi
          KEY="$(mktemp /tmp/teaching-deploy-key.XXXXXX)"
          printf '%s\n' "$TEACHING_DEPLOY_SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          echo "KEY=$KEY" >> "$GITHUB_ENV"

      - name: Pull staged site
        # Staging handoff (Model B) — receiver core. Consumes the render-job
        # staging outputs ONLY through a full re-validation (exact per-segment
        # mirror of "Guard staging path" + run-dir shape + 64-hex digest).
        # The remote path is DERIVED from the validated staging-dir value
        # (never the redundant staging-zip output, never a raw interpolation).
        # Key access mirrors the rsync-live step exactly: $KEY arrives via
        # GITHUB_ENV (written by "Write SSH key" above) and is used UNQUOTED
        # inside the rsync -e string (rsync splits -e on whitespace; escaped
        # inner quotes would reach ssh literally) — same proven form as
        # "rsync to personal server". Local name site-zip/site-zip.zip keeps
        # "Unpack site" byte-unchanged across all transport modes.
        # Typed outcome via steps.pull-staging.outputs.pull-failure:
        #   none       => exit 0 (payload digest-attested)
        #   validation => exit 1 ALWAYS (staging AND both — poison-class)
        #   integrity  => exit 1 ALWAYS (staging AND both — digest mismatch)
        #   transport  => exit 1 in staging (no fallback by design);
        #                 exit 0 in both (soft — artifact Download fallback runs)
        id: pull-staging
        if: github.event_name == 'push' && inputs.site-transport != 'artifact'
        env:
          SITE_TRANSPORT: ${{ inputs.site-transport }}
          STAGING_DIR: ${{ needs.render.outputs.staging-dir }}
          STAGING_SHA256: ${{ needs.render.outputs.staging-sha256 }}
        run: |
          set -uo pipefail
          fail() { # $1=pull-failure class, $2=exit code (::error:: already echoed)
            echo "pull-failure=$1" >> "$GITHUB_OUTPUT"
            exit "$2"
          }
          require_staging_dir() {
            local d="$1" rest seg
            if [[ ! "$d" =~ ^teaching-staging/[^/]+/[^/]+$ ]]; then
              echo "::error::staging-dir malformed (expected exactly teaching-staging/<repo>/<run>-<attempt>): '$d'"
              return 1
            fi
            rest="${d#teaching-staging/}"
            for seg in "${rest%%/*}" "${rest#*/}"; do
              if [[ "$seg" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,99}$ ]] \
                 && [[ "$seg" != "." && "$seg" != ".." ]] \
                 && [[ "$seg" != .* && "$seg" != -* ]]; then
                continue
              fi
              echo "::error::Invalid staging path segment '$seg' — guard mirror: ^[A-Za-z0-9_][A-Za-z0-9._-]{0,99}\$, not '.' or '..', no leading '.' or '-'"
              return 1
            done
          }
          case "$SITE_TRANSPORT" in
            staging|both) ;;
            *)
              echo "::error::Pull staged site invoked with site-transport='$SITE_TRANSPORT' — gate/inputs desynchronized; refusing"
              fail validation 1
              ;;
          esac
          require_staging_dir "$STAGING_DIR" || fail validation 1
          REST="${STAGING_DIR#teaching-staging/}"
          RUN_DIR="${REST#*/}"
          if [[ ! "$RUN_DIR" =~ ^[0-9]+-[0-9]+$ ]]; then
            echo "::error::staging run-dir '$RUN_DIR' is not <run-id>-<attempt> (^[0-9]+-[0-9]+\$) — refusing"
            fail validation 1
          fi
          if [[ ! "$STAGING_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::staging-sha256 missing or malformed (expected ^[0-9a-f]{64}\$): '$STAGING_SHA256'"
            fail validation 1
          fi
          LOCAL_ZIP="$GITHUB_WORKSPACE/site-zip/site-zip.zip"
          mkdir -p "$(dirname "$LOCAL_ZIP")"
          # Transport: rsync primary, scp fallback on TOOL ABSENCE only (Turn C
          # semantics — a present-but-failing transfer is a transport failure,
          # never retried through another tool). Validated path, double quotes,
          # local expansion.
          RC=1
          if command -v rsync >/dev/null 2>&1; then
            rsync -az -e "ssh -i $KEY -o StrictHostKeyChecking=accept-new" "bruno@vai.univ-tln.fr:${STAGING_DIR}/site.zip" "$LOCAL_ZIP" && RC=0
          else
            echo "::notice::rsync absent from the deploy runner — scp fallback (same validated remote path)"
            scp -i "$KEY" -o StrictHostKeyChecking=accept-new "bruno@vai.univ-tln.fr:${STAGING_DIR}/site.zip" "$LOCAL_ZIP" && RC=0
          fi
          if [ "$RC" -ne 0 ] || [ ! -s "$LOCAL_ZIP" ]; then
            rm -f "$LOCAL_ZIP"
            echo "::error::Staging transport failed (rsync/scp non-zero or empty payload) — remote=${STAGING_DIR}/site.zip"
            if [ "$SITE_TRANSPORT" = "both" ]; then
              echo "pull-failure=transport" >> "$GITHUB_OUTPUT"
              echo "::warning::both mode — soft exit: the artifact Download fallback will serve (transport class only; integrity/validation never fall back)"
              exit 0
            fi
            fail transport 1
          fi
          # Integrity: local digest vs the render-verified 64-hex digest.
          LOCAL_SHA="$(sha256sum "$LOCAL_ZIP" | awk '{print $1}')"
          if [[ ! "$LOCAL_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Local sha256 unreadable after pull ('$LOCAL_SHA') — classified integrity"
            rm -f "$LOCAL_ZIP"
            fail integrity 1
          fi
          if [ "$LOCAL_SHA" != "$STAGING_SHA256" ]; then
            echo "::error::digest mismatch — suspicion d'empoisonnement staging ; aucun fallback artifact par conception (local=$LOCAL_SHA expected=$STAGING_SHA256 dir=$STAGING_DIR)"
            rm -f "$LOCAL_ZIP"
            fail integrity 1
          fi
          echo "pull-failure=none" >> "$GITHUB_OUTPUT"
          echo "✅ staged site pulled and digest-attested: ${STAGING_DIR}/site.zip -> $LOCAL_ZIP"

      - name: Download site artifact
        if: github.event_name == 'push' && (inputs.site-transport == 'artifact' || (inputs.site-transport == 'both' && steps.pull-staging.outputs.pull-failure == 'transport'))
        uses: actions/download-artifact@v4
        with:
          name: site-zip
          path: site-zip

      - name: Unpack site
        if: github.event_name == 'push'
        run: |
          mkdir -p site
          cd site-zip
          unzip -o site-zip.zip -d ../site
          FILE_COUNT=$(find ../site -type f | wc -l)
          echo "Site prêt : $FILE_COUNT fichiers"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::site/ contient 0 fichier après unzip — déploiement d'un site vide refusé"
            exit 1
          fi

      - name: Compute target path (REPO + SUBPATH)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_REF: ${{ github.event.ref }}
          EVENT_REF_TYPE: ${{ github.event.ref_type }}
        run: |
          REPO="$(basename "$GITHUB_REPOSITORY")"
          if [ -z "$REPO" ]; then
            echo "::error::REPO vide; déploiement refusé"
            exit 1
          fi
          echo "REPO=$REPO" >> "$GITHUB_ENV"

          # Slug de branche : / -> - ; caractères limités à [A-Za-z0-9._-]
          # (chemins serveur + rm distants exigent un ensemble sûr).
          sanitize_refname() {
            local slug="${1//\//-}"
            case "$slug" in
              *[!A-Za-z0-9._-]*|"")
                echo "::error::nom de réf non sûr pour un chemin serveur: '$1' (slug '$slug'); seuls [A-Za-z0-9._-] et / sont acceptés" >&2
                return 1 ;;
            esac
            printf '%s' "$slug"
          }

          # --- delete : seule la suppression d'UNE branche retire previews/<slug>.
          # FIX v1.3.24 : le payload d'un delete-event ne contient PAS de préfixe
          # refs/ : "ref" est le nom NU (ex. preview/x) et "ref_type" porte
          # "branch" ou "tag" (vécu : run 38566678336). Dispatch sur ref_type ;
          # normalisation défensive d'un préfixe refs/heads/ éventuel.
          if [ "$GITHUB_EVENT_NAME" = "delete" ]; then
            if [ "$EVENT_REF_TYPE" = "branch" ]; then
              DELNAME="${EVENT_REF#refs/heads/}"
              if [ "$DELNAME" = "$DEFAULT_BRANCH" ] || [ "$DELNAME" = "develop" ]; then
                echo "Suppression de la branche par défaut/develop — no-op côté serveur (develop/ n'est JAMAIS supprimé)."
                exit 0
              fi
              DELSUB="previews/$(sanitize_refname "$DELNAME")" || exit 1
              echo "SUBPATH=$DELSUB" >> "$GITHUB_ENV"
              echo "DELETE_PREVIEW=true" >> "$GITHUB_ENV"
              echo "Cible de suppression : bruno@vai.univ-tln.fr:teaching-material/$REPO/$DELSUB/"
            else
              echo "delete (ref_type=${EVENT_REF_TYPE:-?}, ref=${EVENT_REF:-?}) — no-op : les tags supprimés ne touchent jamais releases/ (règle v1.3.22)."
            fi
            exit 0
          fi

          # --- push : le REF décide du CHEMIN (MÊME règle que la baseurl du job render).
          case "$GITHUB_REF" in
            refs/heads/*)
              REFNAME="${GITHUB_REF#refs/heads/}"
              if [ "$REFNAME" = "$DEFAULT_BRANCH" ]; then
                SUBPATH="develop"
              else
                SUBPATH="previews/$(sanitize_refname "$REFNAME")" || exit 1
              fi
              ;;
            refs/tags/v*)
              SUBPATH="releases/${GITHUB_REF#refs/tags/}"
              echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
              ;;
            refs/tags/*)
              echo "::notice::Tag '${GITHUB_REF#refs/tags/}' (non v*) — déploiement ignoré (règle v1.3.22)."
              echo "DEPLOY_SKIP=true" >> "$GITHUB_ENV"
              exit 0
              ;;
            *)
              echo "::error::GITHUB_REF '$GITHUB_REF' n'est ni une branche ni un tag; déploiement refusé"
              exit 1
              ;;
          esac
          if [ -z "$REPO" ] || [ -z "$SUBPATH" ]; then
            echo "::error::REPO ou SUBPATH vide (REPO='$REPO' SUBPATH='$SUBPATH'); déploiement refusé"
            exit 1
          fi
          # SÉCURITÉ (règle n°1 — aucune suppression accidentelle) : la portée de
          # --delete DOIT être exactement teaching-material/$REPO/$SUBPATH/. On refuse
          # si le chemin de destination n'a pas au moins 3 composants (teaching-material
          # / REPO / SUBPATH). Jamais teaching-material/ seul, jamais teaching-material/$REPO/.
          DEST_PATH="teaching-material/$REPO/$SUBPATH"
          COMPONENT_COUNT="$(printf '%s' "$DEST_PATH" | awk -F'/' '{n=0; for(i=1;i<=NF;i++) if($i!="") n++; print n}')"
          if [ "$COMPONENT_COUNT" -lt 3 ]; then
            echo "::error::Vérification de sécurité échouée : '$DEST_PATH' a moins de 3 composants (teaching-material/REPO/SUBPATH) ; rsync --delete refusé"
            exit 1
          fi
          echo "REPO=$REPO" >> "$GITHUB_ENV"
          echo "SUBPATH=$SUBPATH" >> "$GITHUB_ENV"
          echo "Cible de déploiement : bruno@vai.univ-tln.fr:teaching-material/$REPO/$SUBPATH/"

      - name: rsync to personal server (scoped --delete)
        id: rsync-deploy
        if: github.event_name == 'push' && env.DEPLOY_SKIP != 'true'
        run: |
          # Re-vérification de sécurité juste avant le rsync destructif.
          if [ -z "$SUBPATH" ]; then
            echo "::error::Vérification de sécurité échouée : SUBPATH vide ; rsync --delete refusé"
            exit 1
          fi
          DEST="teaching-material/$REPO/$SUBPATH/"
          echo "Portée de rsync --delete : bruno@vai.univ-tln.fr:$DEST"
          rsync -az --delete --mkpath -e "ssh -i $KEY -o StrictHostKeyChecking=accept-new" site/ "bruno@vai.univ-tln.fr:$DEST"
          echo "✅ rsync terminé : bruno@vai.univ-tln.fr:$DEST"

      - name: Remove preview directory (branch delete only)
        # Règle v1.3.22 : une suppression de branche ne retire QUE previews/<slug>.
        # develop/ et releases/ ne sont JAMAIS touchés par un delete event
        # (branche par défaut -> no-op amont ; tag -> no-op amont).
        if: github.event_name == 'delete' && env.DELETE_PREVIEW == 'true'
        run: |
          # Triple garde-fou avant le rm -rf distant.
          if [ -z "$REPO" ] || [ -z "$SUBPATH" ]; then
            echo "::error::REPO/SUBPATH vide; suppression refusée"
            exit 1
          fi
          case "$SUBPATH" in
            previews/*/*)
              echo "::error::Suppression refusée : SUBPATH imbriqué '$SUBPATH'"
              exit 1 ;;
            previews/*) ;;
            *)
              echo "::error::Suppression refusée : SUBPATH '$SUBPATH' hors de previews/"
              exit 1 ;;
          esac
          DEST="teaching-material/$REPO/$SUBPATH"
          COMPONENT_COUNT="$(printf '%s' "$DEST" | awk -F'/' '{n=0; for(i=1;i<=NF;i++) if($i!="") n++; print n}')"
          if [ "$COMPONENT_COUNT" -lt 3 ]; then
            echo "::error::Chemin '$DEST' a moins de 3 composants; suppression refusée"
            exit 1
          fi
          echo "Suppression serveur : bruno@vai.univ-tln.fr:$DEST/"
          ssh -i "$KEY" -o StrictHostKeyChecking=accept-new bruno@vai.univ-tln.fr "rm -rf -- '$DEST'"
          echo "✅ Preview supprimé : bruno@vai.univ-tln.fr:$DEST/"

      - name: Write root placeholder index.html
        if: github.event_name == 'push' && env.DEPLOY_SKIP != 'true'
        run: |
          DEST_DIR="teaching-material/$REPO"
          # Écrasement d'UN SEUL fichier à la racine du dépôt (SANS --delete, SANS sync de répertoire).
          ssh -i "$KEY" -o StrictHostKeyChecking=accept-new bruno@vai.univ-tln.fr "mkdir -p $DEST_DIR && cat > $DEST_DIR/index.html" <<'INDEX_HTML_EOF'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Aucune version stable publique</title>
          <style>
          body { font-family: system-ui, -apple-system, sans-serif; margin: 4rem auto; max-width: 40rem; padding: 0 1rem; color: #1f2328; }
          h1 { font-size: 1.5rem; }
          a { color: #0969da; }
          </style>
          </head>
          <body>
          <h1>Aucune version stable publique</h1>
          <p>Aucune version de ce dépôt n'est déployée au niveau racine. Consultez une branche pour voir un rendu :</p>
          <ul>
          <li><a href="develop/">develop</a></li>
          </ul>
          </body>
          </html>
          INDEX_HTML_EOF
          echo "✅ Placeholder écrit : bruno@vai.univ-tln.fr:$DEST_DIR/index.html"

      - name: Write stable pointer (v* tag releases)
        # Écrit <repo>/stable/index.html (meta-refresh) -> ../releases/<tag>/ après
        # un déploiement réussi de tag v*. RISQUE ACCEPTÉ (v1.3.22, décidé au
        # rollout) : le pointeur est réécrit à CHAQUE push de tag v* couronné de
        # succès — repousser un tag plus ancien ou déployer un hotfix sur un tag
        # antérieur redirige « stable » vers ce tag (dernier déployé gagnant,
        # sans comparaison de versions). Accepté car les tags de release ebpro
        # sont immuables en pratique ; à durcir en semver-compare si besoin.
        if: github.event_name == 'push' && env.TAG != ''
        run: |
          STABLE_DIR="teaching-material/$REPO/stable"
          ssh -i "$KEY" -o StrictHostKeyChecking=accept-new bruno@vai.univ-tln.fr "mkdir -p '$STABLE_DIR' && cat > '$STABLE_DIR/index.html'" <<STABLE_POINTER_EOF
          <!DOCTYPE html>
          <html lang="fr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="refresh" content="0; url=../releases/$TAG/">
          <link rel="canonical" href="../releases/$TAG/">
          <title>Version stable : $TAG</title>
          <style>
          body { font-family: system-ui, -apple-system, sans-serif; margin: 4rem auto; max-width: 40rem; padding: 0 1rem; color: #1f2328; }
          a { color: #0969da; }
          </style>
          </head>
          <body>
          <p>Redirection vers la version stable <a href="../releases/$TAG/">$TAG</a>…</p>
          </body>
          </html>
          STABLE_POINTER_EOF
          echo "✅ Pointeur stable écrit : bruno@vai.univ-tln.fr:$STABLE_DIR/index.html -> releases/$TAG/"

      - name: Cleanup staging
        # Staging handoff (Model B) — post-success housekeeping on vai (spec §4).
        # Runs ONLY on success() (never always(): we purge solely on a proven
        # green deploy). staging-dir is re-validated with the SAME per-segment
        # guard as Pull staged site; the remote script receives ONLY the
        # validated values (double-quoted, local expansion) as bash -s
        # positional args — never interpolated into the script text.
        # Depth-corrected sweep: eviction targets are DIRECT children (run-dirs)
        # of teaching-staging/<REPO> => -mindepth 1 -maxdepth 1 from that base
        # (the spec B4 fragment's -mindepth 2 had an ambiguous root — not
        # copied). Age floor -mmin +60 (15-min deploy timeout x4): a sibling or
        # re-run dir younger than 60 min is NEVER a candidate. Among candidates
        # (mtime desc) the 3 most recent survive (keep-N), the rest are evicted.
        # Hard age-out at 14 days. Positive eviction assertions afterwards.
        # Housekeeping only: any purge problem => ::warning:: + exit 0 (content
        # is already live); the job is never failed by this step.
        if: success() && github.event_name == 'push' && inputs.site-transport != 'artifact'
        env:
          SITE_TRANSPORT: ${{ inputs.site-transport }}
          STAGING_DIR: ${{ needs.render.outputs.staging-dir }}
        run: |
          set -uo pipefail
          require_staging_dir() {
            local d="$1" rest seg
            if [[ ! "$d" =~ ^teaching-staging/[^/]+/[^/]+$ ]]; then
              echo "::error::staging-dir malformed (expected exactly teaching-staging/<repo>/<run>-<attempt>): '$d'"
              return 1
            fi
            rest="${d#teaching-staging/}"
            for seg in "${rest%%/*}" "${rest#*/}"; do
              if [[ "$seg" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,99}$ ]] \
                 && [[ "$seg" != "." && "$seg" != ".." ]] \
                 && [[ "$seg" != .* && "$seg" != -* ]]; then
                continue
              fi
              echo "::error::Invalid staging path segment '$seg' — guard mirror: ^[A-Za-z0-9_][A-Za-z0-9._-]{0,99}\$, not '.' or '..', no leading '.' or '-'"
              return 1
            done
          }
          if [ -z "${KEY:-}" ]; then
            echo "::warning::KEY not present (SSH setup skipped) — staging cleanup not run"
            exit 0
          fi
          case "$SITE_TRANSPORT" in
            staging|both) ;;
            *) echo "::warning::Cleanup staging invoked with site-transport='$SITE_TRANSPORT' — skipping (no blind rm)"; exit 0 ;;
          esac
          if ! require_staging_dir "$STAGING_DIR"; then
            echo "::warning::staging-dir failed receiver validation — cleanup skipped (no blind rm)"
            exit 0
          fi
          REST="${STAGING_DIR#teaching-staging/}"
          REPO="${REST%%/*}"
          RUN_DIR="${REST#*/}"
          if [[ ! "$RUN_DIR" =~ ^[0-9]+-[0-9]+$ ]]; then
            echo "::warning::run-dir '$RUN_DIR' is not <run-id>-<attempt> — cleanup skipped (no blind rm)"
            exit 0
          fi
          RC=0
          OUT="$(ssh -i "$KEY" -o StrictHostKeyChecking=accept-new "bruno@vai.univ-tln.fr" bash -s -- "teaching-staging/$REPO" "$RUN_DIR" <<'REMOTE'
          set -u
          BASE="$1"; CUR_RUN="$2"; FAILED=0
          note() { echo "ASSERT-FAIL $*"; FAILED=1; }
          # Defense-in-depth re-check (authoritative validation is the workflow guard above).
          case "$BASE" in
            teaching-staging/[A-Za-z0-9_][A-Za-z0-9._-]*) ;;
            *) note "base-rejected '$BASE'"; exit 2 ;;
          esac
          case "$CUR_RUN" in
            ''|*[!0-9-]*) note "run-dir-rejected '$CUR_RUN'"; exit 2 ;;
          esac
          BASE="${BASE%/}"
          CUR="$BASE/$CUR_RUN"
          BEFORE_PROT="$(find "$BASE" -mindepth 1 -maxdepth 1 -type d -mmin -60 2>/dev/null || true)"
          # (a) remove the run-dir consumed by THIS run (validated values only)
          if [ -d "$CUR" ]; then
            rm -rf "$CUR" || note "rm-current-failed $CUR"
          fi
          if [ -e "$CUR" ]; then note "rm-current-survived $CUR"; fi
          # (b) keep-N=3 sweep among DIRECT children older than the 60-min floor
          CANDS="$(find "$BASE" -mindepth 1 -maxdepth 1 -type d -mmin +60 2>/dev/null || true)"
          CAND_COUNT="$(printf '%s\n' "$CANDS" | grep -c .)"
          idx=0
          while IFS= read -r d; do
            [ -n "$d" ] || continue
            [ -d "$d" ] || continue
            printf '%s\n' "$CANDS" | grep -Fxq "$d" || continue
            idx=$((idx+1))
            if [ "$idx" -le 3 ]; then
              echo "KEEP $d"
            elif rm -rf "$d"; then
              echo "EVICT $d"
            else
              note "evict-failed $d"
            fi
          done <<LIST
          $(ls -1dt "$BASE"/* 2>/dev/null || true)
          LIST
          AFTER_COUNT="$(find "$BASE" -mindepth 1 -maxdepth 1 -type d -mmin +60 2>/dev/null | grep -c .)"
          EXPECTED=$(( CAND_COUNT < 3 ? CAND_COUNT : 3 ))
          [ "$AFTER_COUNT" -eq "$EXPECTED" ] || note "survivors-after-sweep $AFTER_COUNT expected $EXPECTED"
          # (d-bis) nothing younger than the floor was removed (except the consumed current dir)
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            [ "$p" = "$CUR" ] && continue
            [ -e "$p" ] || note "protected-deleted $p"
          done <<LIST2
          $BEFORE_PROT
          LIST2
          # (c) hard age-out at 14 days
          find "$BASE" -mindepth 1 -maxdepth 1 -type d -mtime +14 -exec rm -rf {} + 2>/dev/null || note "aged-out-rm"
          REMAIN_14D="$(find "$BASE" -mindepth 1 -maxdepth 1 -type d -mtime +14 2>/dev/null | grep -c .)"
          [ "$REMAIN_14D" -eq 0 ] || note "aged-out-survivors $REMAIN_14D"
          exit "$FAILED"
          REMOTE
          )" || RC=$?
          printf '%s\n' "$OUT"
          if [ "$RC" -ne 0 ] || printf '%s\n' "$OUT" | grep -q '^ASSERT-FAIL'; then
            echo "::warning::staging housekeeping incomplete (rc=$RC) — deployment already live; nothing retried blind. Check vai permissions/quota."
          fi
          echo "✅ staging cleanup pass: consumed $STAGING_DIR removed, keep-N=3 (floor 60 min), age-out 14 d"
          exit 0

      - name: Log vai home disk usage (df -h ~, read-only)
        # H3 sizing probe (spec §4): READ-ONLY df on the vai home, logged every
        # staging/both push — including after a failed step (always()), while
        # KEY is still present (this step sits BEFORE Clean up SSH key).
        # Purely informational: a low-disk reading is a ::warning:: for keep-N
        # sizing, NEVER red.
        if: always() && github.event_name == 'push' && inputs.site-transport != 'artifact'
        run: |
          set -uo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "::notice::KEY not present — df probe skipped"
            exit 0
          fi
          RC=0
          OUT="$(ssh -i "$KEY" -o StrictHostKeyChecking=accept-new "bruno@vai.univ-tln.fr" "df -h ~" 2>&1)" || RC=$?
          printf '%s\n' "$OUT"
          if [ "$RC" -ne 0 ]; then
            echo "::warning::df -h probe failed (rc=$RC) — informational only"
            exit 0
          fi
          AVAIL="$(printf '%s\n' "$OUT" | tail -n 1 | awk '{print $4}')"
          LOW="$(awk -v a="$AVAIL" 'BEGIN{
            u = substr(a, length(a), 1); n = substr(a, 1, length(a)-1) + 0;
            m = (u=="K")?1024:(u=="M")?1048576:(u=="G")?1073741824:(u=="T")?1099511627776:1;
            b = (u ~ /[KMGT]/) ? n*m : n;
            print (b < 10737418240) ? "yes" : "no" }')"
          if [ "$LOW" = "yes" ]; then
            echo "::warning::vai home disk low: avail=$AVAIL (< 10 GiB) — revisit keep-N sizing / staging growth (H3)"
          else
            echo "vai home avail: $AVAIL (>= 10 GiB)"
          fi
          exit 0

      - name: Clean up SSH key
        if: always()
        run: |
          if [ -n "${KEY:-}" ]; then
            rm -f "$KEY"
          fi

      - name: Purge website artifact (post-deploy)
        # v1.3.35 (quota): site-zip has served its only purpose once the site
        # landed on the rsync target — delete it from the Team-plan 2 GiB
        # artifact pool immediately (fleet produced 11.3 GiB/7d at 38 consumers;
        # quota exhaustion silently SKIPS deploy-static fleet-wide).
        # Gate: runs iff the rsync step itself executed and succeeded — even
        # when a later placeholder/pointer step failed (deploy is done; always()
        # bypasses the default success() gate). PR runs never reach this job
        # (wrapper passes deploy-static=false); delete events and DEPLOY_SKIP
        # runs skip the rsync step -> gate false -> 1-day retention floor set
        # at upload reclaims the space.
        # Non-fatal by design: missing gh / 403 / 404 race prints a warning and
        # the retention floor still applies. Reports (quarto-exec-log,
        # visual-check-report) are NOT website artifacts — untouched by design.
        if: always() && steps.rsync-deploy.outcome == 'success' && needs.render.outputs.site-artifact-id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE "/repos/${{ github.repository }}/actions/artifacts/${{ needs.render.outputs.site-artifact-id }}" \
            && echo "✅ site-zip artifact ${{ needs.render.outputs.site-artifact-id }} purged after successful deploy" \
            || echo '::warning::purge failed (non-fatal) — the 1-day retention floor will reclaim the artifact'

  trigger-catalog:
    needs: [render]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch teaching-catalog rebuild
        env:
          GH_TOKEN: ${{ secrets.CATALOG_DISPATCH_TOKEN }}
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::CATALOG_DISPATCH_TOKEN not set; skipping catalog trigger."
            exit 0
          fi
          code=$(curl -s -o /tmp/catalog_dispatch.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ebpro/teaching-catalog/actions/workflows/catalog.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "catalog dispatch -> HTTP ${code}: $(cat /tmp/catalog_dispatch.json 2>/dev/null || true)"
          if [ "${code}" != "204" ]; then
            echo "::warning::catalog dispatch did not return 204 (got ${code}); check CATALOG_DISPATCH_TOKEN has Actions:write on ebpro/teaching-catalog."
          fi
