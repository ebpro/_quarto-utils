name: Render Quarto Documents (reusable)

on:
  workflow_call:
    inputs:
      profiles:
        description: 'Comma-separated list of profiles to render (e.g. notes,slides)'
        required: false
        type: string
        default: 'notes,slides'
      quarto-image:
        description: 'Docker image to use for Quarto (must include `quarto` CLI)'
        required: false
        type: string
        default: 'ghcr.io/ebpro/solen:quarto-full-chore-add-pyproject'
      utils-repo:
        description: 'Repository that provides shared Quarto utils (owner/repo)'
        required: false
        type: string
        default: 'ebpro/_quarto-utils'
      utils-ref:
        description: 'Ref (branch or tag) of the utils repo to checkout'
        required: false
        type: string
        default: 'main'
      output-path:
        description: 'Path to output artifacts (glob-friendly)'
        required: false
        type: string
        default: '_output'
    secrets:
      EBPRO_CI_PAT:
        description: 'Read-only PAT for cross-repo fetches of private repos (utils/submodules); falls back to GITHUB_TOKEN when omitted'
        required: false

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact }}
    steps:
      - name: Checkout repository (caller)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Ensure submodules (if used by caller)
        env:
          CI_PAT: ${{ secrets.EBPRO_CI_PAT }}
        run: |
          # GITHUB_TOKEN is scoped to the caller repo; route submodule fetches (SSH or HTTPS) through the read PAT when provided.
          if [ -n "$CI_PAT" ]; then
            git config --global url."https://x-access-token:${CI_PAT}@github.com/".insteadOf "git@github.com:"
            git config --global url."https://x-access-token:${CI_PAT}@github.com/".insteadOf "ssh://git@github.com/"
            git config --global url."https://x-access-token:${CI_PAT}@github.com/".insteadOf "https://github.com/"
          fi
          git submodule update --init --recursive || true

      - name: Checkout utilities repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.utils-repo }}
          ref: ${{ inputs.utils-ref }}
          path: _quarto-utils
          token: ${{ secrets.EBPRO_CI_PAT || secrets.GITHUB_TOKEN }}

      - name: Render with Quarto (Docker)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILES: ${{ inputs.profiles }}
          QUARTO_IMAGE: ${{ inputs.quarto-image }}
          EBPRO_CI_PAT: ${{ secrets.EBPRO_CI_PAT }}
        run: |
          # Private GHCR images (e.g. ghcr.io/ebpro/solen) are not pullable anonymously:
          # authenticate with the org PAT (has read access to the package); docker login
          # exchanges it for a short-lived pull token.
          if [[ "$QUARTO_IMAGE" == ghcr.io/* ]] && [ -n "$EBPRO_CI_PAT" ]; then
            echo "$EBPRO_CI_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          fi
          # Render inside the provided Docker image (default: Solen lecture image, which
          # bundles Quarto plus bash/zsh/python3/Java Jupyter kernels). Mount the full
          # workspace and run the requested profiles. Login shell + sdkman-init so
          # language tools installed via sdkman (e.g. java for IJava) are on PATH.
          IFS=',' read -ra PROFILE_LIST <<< "$PROFILES"
          for p in "${PROFILE_LIST[@]}"; do
            echo "Rendering profile: $p"
            docker run --rm \
              -v "$GITHUB_WORKSPACE":/workdir \
              -w /workdir \
              "$QUARTO_IMAGE" \
              bash -lc "source /home/jovyan/.sdkman/bin/sdkman-init.sh 2>/dev/null || true; quarto render --profile '$p'"
          done

      - name: Package rendered output
        id: package
        env:
          PROFILES: ${{ inputs.profiles }}
          OUTPUT_PATH: ${{ inputs.output-path }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          REPO_NAME=$(basename "$GITHUB_REPOSITORY")
          SHORT_SHA=${GITHUB_SHA:0:7}
          BASE_OUTPUT="$OUTPUT_PATH"
          echo "Creating combined and per-profile artifacts from ${BASE_OUTPUT}"

          # Combined zip (legacy)
          COMBINED_ZIP="${REPO_NAME}-${SHORT_SHA}-${TIMESTAMP}.zip"
          if [ -d "${BASE_OUTPUT}" ]; then
            zip -r "${COMBINED_ZIP}" "${BASE_OUTPUT}"
          else
            echo "Warning: output path '${BASE_OUTPUT}' not found; creating empty artifact file"
            zip "${COMBINED_ZIP}" --filesync --recurse-paths --junk-paths || true
          fi
          echo "artifact=${COMBINED_ZIP}" >> $GITHUB_OUTPUT

          # Per-profile zips (one per profile string passed in)
          IFS=',' read -ra PROFILE_LIST <<< "$PROFILES"
          for p in "${PROFILE_LIST[@]}"; do
            PROFILE_ZIP="${REPO_NAME}-${SHORT_SHA}-${p}-${TIMESTAMP}.zip"
            echo "Creating profile zip: ${PROFILE_ZIP} (profile: $p)"
            if [ -d "${BASE_OUTPUT}" ]; then
              # include whole output for self-contained artifact; may be filtered later
              zip -r "${PROFILE_ZIP}" "${BASE_OUTPUT}"
            else
              zip "${PROFILE_ZIP}" --filesync --recurse-paths --junk-paths || true
            fi
          done

      - name: Upload rendered artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.artifact }}

      - name: Upload site zip (fixed name)
        uses: actions/upload-artifact@v4
        with:
          name: site-zip
          path: ${{ steps.package.outputs.artifact }}

      - name: Upload PDFs (all found in output)
        uses: actions/upload-artifact@v4
        with:
          name: quarto-pdfs
          path: ${{ inputs.output-path }}/**/*.pdf

      - name: Upload HTML files (all found in output)
        uses: actions/upload-artifact@v4
        with:
          name: quarto-html
          path: ${{ inputs.output-path }}/**/*.html

      - name: Install Node uploader dependencies
        run: |
          set -euo pipefail
          cd _quarto-utils
          echo "Installing Node uploader dependencies (prefer lockfile)"
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Upload individual files as separate artifacts
        env:
          OUTPUT_PATH: ${{ inputs.output-path }}
        run: |
          set -euo pipefail
          echo "Running uploader script"
          node _quarto-utils/.github/scripts/upload_individual.js
