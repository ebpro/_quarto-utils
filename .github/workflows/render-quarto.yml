              set +e
              LIMIT=$(( HANG_MIN * 60 ))
              FORENSICS_DIR="$GITHUB_WORKSPACE/hang-forensics"
              mkdir -p "$FORENSICS_DIR"
              DEADLINE=$(( $(date +%s) + LIMIT ))
