# TEMPLATE for consuming repos (lectures/samples/notebooks).
# Copy this file to <your-repo>/.github/workflows/ci-render.yml.
#
# Deployment model:
#   push to main     → GitHub Pages (stable)
#   push to develop  → Cloudflare Pages preview (branch: develop)
#   push to any other branch → Cloudflare Pages preview (branch: <name>)
#   PR to any branch → render for CI validation only (no deploy)
#
# Requires org secrets (visible to all):
#   EBPRO_CI_PAT  — fine-grained PAT for cross-repo checkout
#   CF_API_TOKEN  — Cloudflare API token (Pages:Edit)

name: CI Render

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  render:
    uses: ebpro/_quarto-utils/.github/workflows/render-quarto.yml@v1.3.41
    secrets: inherit
    with:
      utils-ref: v1.3.38
      # Staging transport: the site-zip artifact upload leaves the push+PR path
      # entirely (quota-immune) and deploy-static pulls from teaching-staging on
      # the server — the self-test finally exercises the deploy-static leg.
      site-transport: staging
      hang-detection-minutes: 15
      # seo-directives: false — fleet rule for slides-profile consumers pinned >=v1.3.38
      # (PR #38 safeMove double-output class; notebook-git canary precedent; same
      # shape as the v1.3.39 pin-wave consumers). The develop-only direct run of
      # render-quarto.yml keeps exercising the seo layer defaults.
      seo-directives: false
      quarto-image: "ghcr.io/ebpro/solen:quarto-full-build-20261010T172146Z"
      profiles: "notes,slides"
      deploy-static: ${{ github.event_name != 'pull_request' }}
      # cf-project-name: "your-repo-name"  # Optional: override auto-derived name
      enable-docker: false
