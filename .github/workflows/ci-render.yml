# TEMPLATE for consuming repos (lectures/samples/notebooks).
# Copy this file to <your-repo>/.github/workflows/ci-render.yml.
#
# REPO SELF-TEST COPY (load-bearing — do not "tidy" without reading):
#   The `uses:` below is a LOCAL PATH on purpose. A tag-pinned
#   `uses: ebpro/_quarto-utils/.github/workflows/render-quarto.yml@<tag>`
#   makes GitHub parse the TAG's file, so consumer runs of the tag parse
#   fine while the develop copy breaks — that is exactly the blind spot
#   behind the v1.3.41…v1.3.44 "Exceeded max expression length 21000"
#   incidents (the self-test pinned @v1.3.38 while develop had grown past
#   the cap). With a local path, GitHub parses THIS repo's current branch
#   file at run creation: a created/queued `render` job PROVES the file
#   parses; a 0-job startup_failure with the expression error is the
#   regression signal. `utils-ref: ${{ github.sha }}` (not a branch name)
#   because the render step now fail-closed-sources
#   scripts/render-sidecar.sh from the utils checkout — the checkout must
#   carry the sidecar, and github.sha is the exact commit under test
#   (push: the pushed commit; pull_request: the PR merge commit; both
#   exist in this repo).
#   CONSUMERS: when copying this template, restore the repo-qualified
#   `uses: ebpro/_quarto-utils/.github/workflows/render-quarto.yml@<tag>`
#   and a pinned `utils-ref: <same tag>` — a local path only makes sense
#   in this repo, and a tag pin is what a consumer's fleet should track.
#
# Deployment model:
#   push to main     → GitHub Pages (stable)
#   push to develop  → Cloudflare Pages preview (branch: develop)
#   push to any other branch → Cloudflare Pages preview (branch: <name>)
#   PR to any branch → render for CI validation only (no deploy)
#
# Requires org secrets (visible to all):
#   EBPRO_CI_PAT  — fine-grained PAT for cross-repo checkout
#   CF_API_TOKEN  — Cloudflare API token (Pages:Edit)

name: CI Render

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  render:
    # LOCAL PATH = the parse gate (see header): parsing this branch's
    # render-quarto.yml is what the run's job creation proves.
    uses: ./.github/workflows/render-quarto.yml
    secrets: inherit
    with:
      # Exact commit under test (push: pushed commit; PR: merge commit) —
      # must carry scripts/render-sidecar.sh, which the render step
      # fail-closed-sources from this checkout.
      utils-ref: ${{ github.sha }}
      # Staging transport: the site-zip artifact upload leaves the push+PR path
      # entirely (quota-immune) and deploy-static pulls from teaching-staging on
      # the server — the self-test finally exercises the deploy-static leg.
      site-transport: staging
      hang-detection-minutes: 15
      # seo-directives: false — fleet rule for slides-profile consumers pinned >=v1.3.38
      # (PR #38 safeMove double-output class; notebook-git canary precedent; same
      # shape as the v1.3.39 pin-wave consumers). The develop-only direct run of
      # render-quarto.yml keeps exercising the seo layer defaults.
      seo-directives: false
      quarto-image: "ghcr.io/ebpro/solen:quarto-full-56784a2"
      profiles: "notes,slides"
      deploy-static: ${{ github.event_name != 'pull_request' }}
      # cf-project-name: "your-repo-name"  # Optional: override auto-derived name
      enable-docker: false
