# TEMPLATE for consuming repos (lectures/samples).
# Copy this file to <your-repo>/.github/workflows/ci-render.yml and add your
# push/pull_request triggers there. Kept dispatch-only here so the utils repo
# itself does not run a render on every push (it has no Quarto project).
name: Render Quarto (calls shared workflow)

on:
  workflow_dispatch:

jobs:
  call-shared-render:
    uses: ebpro/_quarto-utils/.github/workflows/render-quarto.yml@v1.0.4
    with:
      profiles: 'notes,slides'
      quarto-image: 'ghcr.io/ebpro/solen:quarto-full-chore-add-pyproject'
      utils-repo: 'ebpro/_quarto-utils'
      utils-ref: 'v1.0.4'
      output-path: '_output'
    secrets:
      EBPRO_CI_PAT: ${{ secrets.EBPRO_CI_PAT }}
